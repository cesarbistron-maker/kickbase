<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Männer Kickbase</title>
<meta name="description" content="Live-Stand, Strafenkasse und Statistiken der Liga Männer Kickbase">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kickbase">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700;800&family=Saira+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root {
  color-scheme: dark;
  --bg: #121212;
  --flaeche: #1C1C1E;
  --flaeche-hoch: #28282B;
  --linie: #2A2A2D;
  --text: #F5F5F5;
  --grau: #8E8E93;
  --gold: #F7C51E;
  --gruen: #2BD97C;
  --lime: #B6E534;
  --orange: #FF9F2E;
  --rot: #FF4D4D;
  --live: #E8671C;
  --offen: #3B82F6;
  --gespielt: #3A3A3D;
  --balken: #6B6B70;
  --kgelb: #F5D547;
  --krot: #F0524F;
  --ueber: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --ziffer: "Saira Semi Condensed", "Barlow Condensed", system-ui, sans-serif;
  --schrift: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --rand: 16px;
  --unten: calc(66px + env(safe-area-inset-bottom));
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.45 var(--schrift); letter-spacing: .01em; min-height: 100vh;
  padding: env(safe-area-inset-top) 0 var(--unten);
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.zahl { font-family: var(--ziffer); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.leise { color: var(--grau); }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 var(--rand); }
h1 { margin: 0; font: 800 44px/0.95 var(--ueber); text-transform: uppercase; letter-spacing: .005em; }
h2 { margin: 32px 0 10px; font: 800 24px/1.1 var(--ueber); text-transform: uppercase; letter-spacing: .01em; }
.erklaer { font-size: 13px; color: var(--grau); margin: 12px 0 0; }
h2 + .erklaer { margin-top: -4px; }

/* Punktefarben wie in der App: hoch grün, mittel hellgrün, wenig orange, negativ rot */
.p-hoch { color: var(--gruen); }
.p-mittel { color: var(--lime); }
.p-tief { color: var(--orange); }
.p-neg { color: var(--rot); }
.p-tag { color: var(--gruen); }
.p-saison { color: var(--gold); }

/* Kopf */
.kopf { position: sticky; top: 0; z-index: 5; background: rgba(18, 18, 18, .94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.kopf .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 54px; }
.liga { grid-column: 2; font: 600 15px/1 var(--schrift); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.stand { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--grau); padding: 10px 0 10px 8px; }
.stand svg { width: 18px; height: 18px; color: var(--text); }
.stand.laedt svg { animation: drehen 1s linear infinite; }
@keyframes drehen { to { transform: rotate(360deg); } }

/* Kopfbereich einer Seite */
.held { padding: 18px 0 4px; }
.held .lage { margin: 8px 0 0; font-size: 15px; color: var(--grau); }
.held .lage b { color: var(--text); font-weight: 600; }
.held .lage .live { color: var(--live); font-weight: 600; }
.statzeile { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }

/* Umschalter im App-Stil: gewählt = weiß umrandet */
.seg { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 18px calc(-1 * var(--rand)) 0; padding: 0 var(--rand); }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; padding: 10px 15px; border: 1.5px solid transparent; border-radius: 12px; font: 600 13px/1 var(--schrift); letter-spacing: .09em; text-transform: uppercase; color: var(--grau); }
.seg button[aria-pressed="true"] { color: var(--text); border-color: var(--text); }
.seg.klein { margin: 0; padding: 0; flex: none; overflow: visible; }
.seg.klein button { padding: 8px 11px; font-size: 11.5px; border-radius: 10px; }

/* Bilder: Porträts, Manager, Vereinslogos (mit Initialen, falls kein Bild) */
.ava { position: relative; flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--flaeche-hoch); }
.ava img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.ava.sp img { object-position: 50% 12%; }
.ava .ini { font: 800 15px/1 var(--ueber); color: var(--grau); letter-spacing: .04em; text-transform: uppercase; }
.ava.da .ini { visibility: hidden; }
.ava.logo { background: none; border-radius: 6px; }
.ava.logo img { object-fit: contain; border-radius: 0; padding: 3px; }
.ava.logo .ini { font-size: 12px; color: var(--grau); }
.ava.logo.da { background: none; }
.ava .cap { position: absolute; left: -3px; bottom: -2px; z-index: 2; width: 19px; height: 19px; border-radius: 50%; background: var(--text); color: var(--bg); font: 800 12px/19px var(--ueber); text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.ava .vlogo { position: absolute; right: -4px; bottom: -3px; z-index: 2; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; }
.ava .vlogo img { position: static; width: 16px; height: 16px; border-radius: 0; object-fit: contain; }
.s64 { width: 64px; height: 64px; } .s64 .ini { font-size: 20px; }
.s52 { width: 52px; height: 52px; }
.s44 { width: 44px; height: 44px; }
.s40 { width: 40px; height: 40px; } .s40 .ini { font-size: 14px; }
.s36 { width: 36px; height: 36px; } .s36 .ini { font-size: 13px; }
.s28 { width: 28px; height: 28px; } .s28 .ini { font-size: 11px; }
.s24 { width: 24px; height: 24px; } .s24 .ini { font-size: 9px; }

/* Rangabzeichen */
.rp { display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--flaeche-hoch); font: 700 13px/1 var(--ziffer); color: var(--text); flex: none; }
.rp.r1 { color: var(--gold); }
.rp.r2 { color: #D2D6DD; }
.rp.r3 { color: #DDA36B; }

/* Ranglistenzeile */
.liste { list-style: none; margin: 0; padding: 0; }
.rz { margin: 0 -10px; padding: 0 10px; border-radius: 14px; }
.rz.meins { background: rgba(247, 197, 30, .07); }
.reihe { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "ava name wert" "ava info info";
  column-gap: 14px; row-gap: 5px; align-items: center; padding: 12px 0; }
.reihe.mit-bar { grid-template-areas: "ava name wert" "ava info info" "ava bar bar"; }
.reihe > .ava { grid-area: ava; }
.reihe .name { grid-area: name; font: 500 17px/1.2 var(--schrift); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.reihe .name em { font-style: normal; font-weight: 500; color: var(--grau); font-size: 12px; margin-left: 7px; letter-spacing: .04em; }
.reihe .info { grid-area: info; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; font-size: 13px; color: var(--grau); min-width: 0; }
.reihe .wert { grid-area: wert; font: 700 27px/1 var(--ziffer); text-align: right; white-space: nowrap; align-self: end; }
.reihe .wert small { font: 600 13px/1 var(--schrift); color: var(--grau); margin-left: 2px; }
.reihe .bar { grid-area: bar; }
.du { font: 700 10px/1 var(--schrift); letter-spacing: .12em; color: var(--gold); margin-left: 7px; vertical-align: 2px; text-transform: uppercase; }
.info .du { margin-left: 0; vertical-align: 0; font-size: 12px; letter-spacing: .02em; text-transform: none; }

/* Balken */
.bar { display: flex; gap: 2px; height: 6px; }
.bar span { display: block; height: 100%; border-radius: 3px; min-width: 3px; background: var(--balken); }
.bar .g { background: var(--gespielt); }
.bar .l { background: var(--live); }
.bar .o { background: var(--offen); }
.bar .leer { background: transparent; border: 1px dashed var(--linie); }
.bar .tor { background: var(--live); }
.bar .vor { background: var(--offen); }
.rz.meins .bar .einzeln { background: var(--gold); }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 18px 0 6px; font-size: 12px; color: var(--grau); }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legende.dicht { margin: 10px 0 4px; }
.puls { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 5px; vertical-align: 1px; }
@media (prefers-reduced-motion: no-preference) { .puls { animation: puls 1.6s ease-in-out infinite; } }
@keyframes puls { 50% { opacity: .25; } }
.live-t { color: var(--live); font-weight: 600; }

/* Live */
.zeiten { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 6px; margin: 16px 0 4px; }
.zeit { background: var(--flaeche); border: 1.5px solid transparent; border-radius: 12px; padding: 8px 4px 7px; text-align: center; }
.zeit .tag { display: block; font: 600 11px/1.2 var(--schrift); letter-spacing: .1em; text-transform: uppercase; color: var(--grau); }
.zeit .uhr { display: block; font: 700 19px/1.2 var(--ziffer); }
.zeit .zu { display: block; font: 700 10px/1.3 var(--schrift); letter-spacing: .1em; text-transform: uppercase; color: var(--grau); margin-top: 1px; }
.zeit.fertig { opacity: .45; }
.zeit.live { border-color: var(--live); }
.zeit.live .zu { color: var(--live); font-style: italic; }
.ich { margin: 14px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--flaeche); display: flex; align-items: center; gap: 12px; }
.ich .wer { font: 800 20px/1 var(--ueber); text-transform: uppercase; }
.ich .was { font-size: 13px; color: var(--grau); margin-top: 4px; }
.ich > .zahl { margin-left: auto; font-size: 28px; }
.details { padding: 2px 0 18px; }
.details .seg { margin-bottom: 4px; }
.gruppe { margin-top: 12px; }
.gruppe h3 { margin: 0 0 2px; font: 600 11px/1.3 var(--schrift); letter-spacing: .1em; text-transform: uppercase; color: var(--grau); }
.sp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 7px 0; }
.sp .n { min-width: 0; font-weight: 500; font-size: 15px; line-height: 1.25; }
.sp .n span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp .n em { display: block; font-style: normal; font-size: 12px; color: var(--grau); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp .p { font: 700 21px/1 var(--ziffer); text-align: right; min-width: 50px; }
.sp.offen .p { font: 500 13px/1.2 var(--schrift); color: var(--grau); }
.knopf { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--schrift); letter-spacing: .09em; text-transform: uppercase; border: 1.5px solid var(--linie); border-radius: 12px; padding: 10px 13px; margin: 14px 8px 0 0; color: var(--text); }
.knopf.gold { border-color: rgba(247, 197, 30, .6); color: var(--gold); }

/* Spielfeld */
.feld { position: relative; margin: 14px 0 4px; border: 1px solid var(--linie); border-radius: 4px; padding: 30px 2px 18px; display: flex; flex-direction: column; gap: 14px; background: #161617; overflow: hidden; }
.feld .linien { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.feld .linien * { fill: none; stroke: #2E2E31; stroke-width: 1.3; vector-effect: non-scaling-stroke; }
.feld .formation { position: absolute; top: 9px; left: 11px; font: 700 13px/1 var(--ziffer); color: var(--grau); }
.feld .feldinfo { position: absolute; top: 10px; right: 11px; font: 600 10.5px/1 var(--schrift); letter-spacing: .08em; text-transform: uppercase; color: var(--grau); }
.feld .summe { position: absolute; right: 14px; bottom: 16px; text-align: right; }
.feld .summe b { display: block; font: 700 30px/1 var(--ziffer); }
.feld .summe span { font: 600 10.5px/1 var(--schrift); letter-spacing: .12em; text-transform: uppercase; color: var(--grau); }
.freihe { position: relative; display: flex; justify-content: space-evenly; }
.fs { flex: 0 1 76px; min-width: 0; padding: 0 2px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.fs .ava { margin-bottom: 5px; }
.fs .nm { display: block; max-width: 100%; font-size: 11.5px; font-weight: 500; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fs .wt { display: block; font: 700 17px/1.25 var(--ziffer); }
.fs .wt.klein { font: 500 11px/1.5 var(--schrift); color: var(--grau); }

/* Strafen */
.kasse { padding: 18px 0 4px; }
.kasse .ueber { font: 600 12px/1 var(--schrift); letter-spacing: .12em; text-transform: uppercase; color: var(--grau); margin-bottom: 10px; }
.kasse .betrag { font: 700 62px/0.95 var(--ziffer); color: var(--gold); }
.kasse .betrag small { font-size: 34px; margin-left: 4px; }
.kasse p { margin: 8px 0 0; color: var(--grau); font-size: 15px; }
.tarif { display: flex; gap: 8px 16px; flex-wrap: wrap; margin: 16px 0 14px; font-size: 13px; color: var(--grau); }
.tarif > span { display: inline-flex; align-items: center; gap: 7px; }
.karte { display: inline-grid; place-items: center; width: 22px; height: 30px; border-radius: 3px; font: 700 13px/1 var(--ziffer); color: #2A1A00; background: var(--kgelb); transform: rotate(-6deg); flex: none; }
.karte.rot { background: var(--krot); color: #fff; }
.karte.klein { width: 12px; height: 16px; font-size: 0; border-radius: 2px; }
.karten { display: flex; gap: 3px; flex-wrap: wrap; }
.wert.null { color: var(--gruen); }
.tag-block { background: var(--flaeche); border-radius: 14px; margin-bottom: 8px; padding: 0 14px; }
.tag-block > button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 15px 0; font: 800 19px/1 var(--ueber); text-transform: uppercase; }
.tag-block > button .betr { margin-left: auto; font: 700 17px/1 var(--ziffer); color: var(--gold); }
.tag-block ol { list-style: none; margin: 0; padding: 0 0 10px; }
.tag-block li { display: grid; grid-template-columns: 26px auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 15px; }
.tag-block li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-block li .pk { color: var(--grau); font: 600 14px/1 var(--ziffer); }
.pfeil { transition: transform .2s; width: 18px; height: 18px; flex: none; color: var(--grau); }
[aria-expanded="true"] .pfeil { transform: rotate(180deg); }

/* Saison */
.chart-box { margin: 14px 0 6px; position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--flaeche-hoch); border-radius: 10px; padding: 9px 11px; font-size: 13px; line-height: 1.35; min-width: 150px; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
.tip b { font: 700 20px/1.1 var(--ziffer); color: var(--gold); }
table.saison { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 4px; }
table.saison th { font: 600 10.5px/1 var(--schrift); letter-spacing: .1em; text-transform: uppercase; color: var(--grau); text-align: right; padding: 8px 4px; }
table.saison th:nth-child(2), table.saison td:nth-child(2) { text-align: left; }
table.saison td { padding: 8px 4px; text-align: right; border-top: 1px solid var(--linie); font: 600 15px/1 var(--ziffer); }
table.saison td:first-child { width: 36px; }
table.saison td:nth-child(2) { font: 500 15px/1.2 var(--schrift); }
table.saison td.gesamt { font-size: 19px; color: var(--gold); }
table.saison .mn { display: flex; align-items: center; gap: 9px; min-width: 0; max-width: 150px; }
table.saison .mn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.saison tr { cursor: pointer; }
table.saison tr.gewaehlt td { background: rgba(247, 197, 30, .08); }
table.saison tr.gewaehlt .mn span { color: var(--gold); font-weight: 600; }

/* Statistik */
.mehr { display: block; width: 100%; text-align: center; padding: 16px 0; color: var(--text); font: 600 12px/1 var(--schrift); letter-spacing: .1em; text-transform: uppercase; }
.aufzu { padding: 0 0 16px 62px; font-size: 14px; }
.aufzu h3 { margin: 4px 0 7px; font: 600 11px/1.3 var(--schrift); letter-spacing: .1em; text-transform: uppercase; color: var(--grau); }
.tage { display: flex; flex-wrap: wrap; gap: 6px; }
.tage span { background: var(--flaeche); border-radius: 8px; padding: 5px 8px; font-size: 11px; color: var(--grau); line-height: 1.25; text-align: center; min-width: 50px; }
.tage b { display: block; font: 700 17px/1.15 var(--ziffer); }
.wer { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 14px; }
.wer li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; break-inside: avoid; }
.wer li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wer li span:last-child { color: var(--grau); font-family: var(--ziffer); font-weight: 600; }
.wer .ich-n { color: var(--gold); }
.kacheln { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 18px 0 4px; }
.kachel { background: var(--flaeche); border-radius: 14px; padding: 11px 10px 10px; min-width: 0; }
.kachel .w { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 5px; font: 700 24px/1.05 var(--ziffer); }
.kachel .t { font: 600 10.5px/1.25 var(--schrift); letter-spacing: .07em; text-transform: uppercase; margin-top: 6px; }
.kachel .vgl { font-size: 11px; color: var(--grau); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.delta { font: 600 12px/1 var(--schrift); white-space: nowrap; }
.delta.plus { color: var(--gruen); }
.delta.minus { color: var(--rot); }
.zurueck { display: inline-flex; align-items: center; gap: 4px; margin-top: 16px; padding: 4px 0; font: 600 12px/1 var(--schrift); letter-spacing: .1em; text-transform: uppercase; }
.zurueck svg { width: 18px; height: 18px; transform: rotate(90deg); color: var(--text); }
.profilkopf { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.profilkopf h1 { font-size: 36px; overflow-wrap: anywhere; }
.profilkopf .lage { margin: 6px 0 0; font-size: 14px; color: var(--grau); }
.profilkopf .lage b { color: var(--gold); font-weight: 600; }
.profilzeit { margin-top: 14px; }
.spur-z { display: grid; grid-template-columns: 40px 1fr 56px; gap: 10px; align-items: center; padding: 7px 0; font-size: 14px; }
.spur-z.breit { grid-template-columns: 24px 86px 1fr 34px; }
.spur-z .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spur-z .posk { font: 700 13px/1 var(--ziffer); color: var(--grau); }
.spur { position: relative; height: 8px; border-radius: 4px; background: #222225; }
.spur span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--balken); }
.spur.rest span { background: var(--gespielt); }
.spur i { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--text); }
.spur-z .zahl { text-align: right; font-size: 18px; }
.ez { display: grid; grid-template-columns: 36px auto minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 8px 0; }
.ez .d { font: 600 12px/1 var(--ziffer); color: var(--grau); }
.ez .n { min-width: 0; font-weight: 500; font-size: 15px; line-height: 1.25; }
.ez .n span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ez .n em { display: block; font-style: normal; font-size: 12px; color: var(--grau); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ez .p { font: 700 21px/1 var(--ziffer); text-align: right; }
.karten-zeile { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--grau); margin: 14px 0 0; }
.karten-zeile span { display: inline-flex; align-items: center; gap: 8px; }

/* Hinweise */
.hinweis { margin: 24px 0; padding: 16px; border-radius: 14px; background: var(--flaeche); color: var(--grau); font-size: 15px; }
.hinweis strong { color: var(--text); display: block; margin-bottom: 4px; font: 800 19px/1.2 var(--ueber); text-transform: uppercase; }
.hinweis button { margin-top: 12px; }
.laedt-text { margin: 28px 0; color: var(--grau); }
.fuss { font-size: 12px; color: var(--grau); text-align: center; padding: 24px 0 10px; }

/* Navigation */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(18, 18, 18, .97); backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px); border-top: 1px solid #232326; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: 64px; padding: 0 4px; }
nav.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font: 600 10px/1 var(--schrift); letter-spacing: .08em; text-transform: uppercase; color: #6E6E73; min-width: 0; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-selected="true"] { color: var(--text); }
section[hidden] { display: none; }
</style>
</head>
<body>
<header class="kopf">
  <div class="wrap">
    <div class="liga">Männer Kickbase</div>
    <button class="stand" id="stand" aria-label="Jetzt aktualisieren">
      <span id="standText">lädt</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section id="v-live" aria-label="Live"><p class="laedt-text">Daten werden geladen …</p></section>
  <section id="v-strafen" aria-label="Strafen" hidden></section>
  <section id="v-saison" aria-label="Saison" hidden></section>
  <section id="v-spieler" aria-label="Spieler" hidden></section>
  <section id="v-manager" aria-label="Manager" hidden></section>
  <p class="fuss" id="fuss"></p>
</main>

<nav class="tabs" aria-label="Bereiche">
  <div class="wrap" role="tablist">
    <button role="tab" data-v="live" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2h5"/></svg>
      Live
    </button>
    <button role="tab" data-v="strafen" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="11" height="16" rx="1.5" transform="rotate(-8 11.5 11)"/></svg>
      Strafen
    </button>
    <button role="tab" data-v="saison" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>
      Saison
    </button>
    <button role="tab" data-v="spieler" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3.5 3 6.5l2 4.2 2.5-1.2V20.5h9V9.5l2.5 1.2 2-4.2-5.5-3c-.6 1.6-1.9 2.5-3.5 2.5S9.1 5.1 8.5 3.5z"/></svg>
      Spieler
    </button>
    <button role="tab" data-v="manager" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.6-3.9 3.7-6.5 7.5-6.5s6.9 2.6 7.5 6.5"/></svg>
      Manager
    </button>
  </div>
</nav>

<script>
(function () {
  "use strict";
  const API = (window.KB_API || "").trim();
  const NF = new Intl.NumberFormat("de-DE");
  const NF1 = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const NF0 = v => NF.format(Math.round(v));
  const EURZ = v => (Math.round(v * 100) / 100).toLocaleString("de-DE", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  const EUR = v => EURZ(v) + " €";
  const SVG_PFEIL = '<svg class="pfeil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const FUHR = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" });
  const FTAG = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", weekday: "short" });
  const uhr = t => FUHR.format(new Date(t));
  const tag = t => FTAG.format(new Date(t)).replace(".", "");
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* privat */ } },
  };
  const pk = p => p == null ? "" : p < 0 ? "p-neg" : p < 100 ? "p-tief" : p < 200 ? "p-mittel" : "p-hoch";
  const hinweis = (titel, text) => '<div class="hinweis"><strong>' + titel + '</strong>' + text + '</div>';
  function setzen(el, h) { if (el.__h === h) return false; el.innerHTML = h; el.__h = h; return true; }

  let D = null;                 // letzte Daten
  let ladezeit = 0;
  let offen = new Set();        // aufgeklappte Manager
  let offenTage = null;         // null = nur der neueste Spieltag aufgeklappt
  let ich = store.get("kb_ich");
  let gewaehlt = null;          // Manager im Saison-Diagramm
  let ansicht = store.get("kb_ansicht") || "live";
  let detailAnsicht = store.get("kb_detail") || "feld";

  // ------------------------------------------------------------ Bilder aus Kickbase
  const BILDER = { basis: "", s: {}, m: {}, v: {} };
  const bildOk = new Set(), bildKaputt = new Set();
  function bilderUebernehmen(b) {
    if (!b) return;
    if (b.basis) BILDER.basis = b.basis;
    ["s", "m", "v"].forEach(k => Object.assign(BILDER[k], b[k] || {}));
  }
  const bildUrl = p => !p ? "" : /^https?:\/\//i.test(p) ? p : BILDER.basis + String(p).replace(/^\/+/, "");
  function initialen(n) {
    const w = String(n || "?").replace(/[^\p{L}\p{N}\s-]/gu, "").trim().split(/[\s-]+/).filter(Boolean);
    if (!w.length) return "?";
    return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase();
  }
  function img(url) {
    return url && !bildKaputt.has(url) ? '<img src="' + esc(url) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">' : "";
  }
  function ava(url, name, cls, o) {
    o = o || {};
    const u = url && !bildKaputt.has(url) ? url : "";
    const logo = o.verein ? bildUrl(BILDER.v[o.verein]) : "";
    return '<span class="ava ' + (cls || "") + (u && bildOk.has(u) ? " da" : "") + '" aria-hidden="true"><span class="ini">' +
      esc(/\blogo\b/.test(cls || "") ? String(name || "?").replace(/[^\p{L}]/gu, "").slice(0, 3) : initialen(name)) + '</span>' + img(u) +
      (o.kap ? '<span class="cap">C</span>' : "") + (logo && !bildKaputt.has(logo) ? '<span class="vlogo">' + img(logo) + '</span>' : "") + '</span>';
  }
  const spielerAva = (id, name, cls, o) => ava(bildUrl(BILDER.s[id]), name, "sp " + (cls || ""), o);
  const managerAva = (id, name, cls) => ava(bildUrl(BILDER.m[id]), name, "mg " + (cls || ""));
  const vereinAva = (name, cls) => ava(bildUrl(BILDER.v[name]), name, "logo " + (cls || ""));
  document.addEventListener("load", e => {
    const t = e.target;
    if (t.tagName !== "IMG" || !t.parentNode) return;
    bildOk.add(t.getAttribute("src"));
    if (t.parentNode.classList.contains("ava")) t.parentNode.classList.add("da");
  }, true);
  document.addEventListener("error", e => {
    const t = e.target;
    if (t.tagName !== "IMG" || !t.parentNode) return;
    bildKaputt.add(t.getAttribute("src"));
    const p = t.parentNode;
    if (p.classList.contains("vlogo")) p.remove();
    else { p.classList.remove("da"); t.remove(); }
  }, true);

  // ------------------------------------------------------------ Laden
  function jsonp(url) {
    return new Promise((ok, fehler) => {
      const cb = "kbCb" + Math.random().toString(36).slice(2, 8);
      const s = document.createElement("script");
      const t = setTimeout(() => { aufraeumen(); fehler(new Error("Zeitüberschreitung")); }, 15000);
      function aufraeumen() { clearTimeout(t); delete window[cb]; s.remove(); }
      window[cb] = d => { aufraeumen(); ok(d); };
      s.onerror = () => { aufraeumen(); fehler(new Error("Netzwerkfehler")); };
      s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb + "&t=" + Date.now();
      document.head.appendChild(s);
    });
  }
  async function holen(teil) {
    const url = API + (teil ? (API.includes("?") ? "&" : "?") + "teil=" + teil : "");
    try {
      const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { redirect: "follow" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      return jsonp(url);
    }
  }
  async function laden() {
    if (!API) { zeigeEinrichtung(); return; }
    const knopf = document.getElementById("stand");
    knopf.classList.add("laedt");
    try {
      const d = await holen();
      if (!d || d.ok === false) throw new Error((d && d.fehler) || "Keine Daten");
      D = d; ladezeit = Date.now();
      bilderUebernehmen(d.bilder);
      store.set("kb_daten", JSON.stringify(d));   // beim nächsten Öffnen sofort sichtbar
      rendern();
      historieLaden();                            // nur wenn sich die Statistik-Version geändert hat
    } catch (e) {
      if (!D) zeigeFehler(e.message);
      document.getElementById("standText").textContent = "offline";
    } finally {
      knopf.classList.remove("laedt");
    }
  }

  // ------------------------------------------------------------ Live
  function status(sp, jetzt) {
    if (!sp.anstoss) return "offen";
    if (jetzt < sp.anstoss) return "offen";
    if (jetzt < sp.anstoss + D.spieldauer * 60000) return "live";
    return "fertig";
  }
  function auswerten(jetzt) {
    const ms = D.manager.map(m => {
      const s = { g: 0, l: 0, o: 0, nL: 0, nO: 0 };
      m.spieler.forEach(sp => {
        const st = status(sp, jetzt);
        const p = sp.preis || 0;
        if (st === "fertig") s.g += p; else if (st === "live") { s.l += p; s.nL++; } else { s.o += p; s.nO++; }
      });
      return Object.assign({}, m, s, { summe: s.g + s.l + s.o });
    });
    ms.sort((a, b) => b.punkte - a.punkte || a.name.localeCompare(b.name, "de"));
    let platz = 0, vorher = null;
    ms.forEach((m, i) => { if (m.punkte !== vorher) { platz = i + 1; vorher = m.punkte; } m.platz = platz; });
    return ms;
  }
  function anstossZeiten() {
    const z = new Set();
    D.manager.forEach(m => m.spieler.forEach(sp => sp.anstoss && z.add(sp.anstoss)));
    return [...z].sort((a, b) => a - b);
  }
  const rp = n => '<span class="rp' + (n <= 3 ? " r" + n : "") + '">' + n + '</span>';
  const duTag = id => id === ich ? '<span class="du">Du</span>' : "";

  function renderLive() {
    const el = document.getElementById("v-live");
    const jetzt = Date.now();
    if (!D.manager.length) {
      setzen(el, '<div class="held"><h1>Spieltag ' + esc(D.spieltag || "") + '</h1></div>' +
        hinweis("Noch keine Aufstellungen", "Sie erscheinen hier kurz nach dem ersten Anpfiff des Spieltags."));
      return;
    }
    const ms = auswerten(jetzt);
    const zeiten = anstossZeiten();
    const dauer = D.spieldauer * 60000;
    const nLive = zeiten.filter(t => jetzt >= t && jetzt < t + dauer).length;
    const nFertig = zeiten.filter(t => jetzt >= t + dauer).length;
    let lage;
    if (nFertig === zeiten.length) lage = "Spieltag beendet.";
    else if (nLive) lage = '<span class="live">Läuft gerade.</span> ' + nFertig + " von " + zeiten.length + " Anstoßzeiten abgeschlossen.";
    else if (nFertig === 0) lage = "Beginnt " + tag(zeiten[0]) + " " + uhr(zeiten[0]) + ".";
    else { const n = zeiten.find(t => t > jetzt); lage = "Weiter geht es " + tag(n) + " " + uhr(n) + "."; }
    const max = Math.max(D.budget, ...ms.map(m => m.summe));
    const ichM = ms.find(m => m.id === ich);

    let h = '<div class="held"><h1>Spieltag ' + esc(D.spieltag || "") + '</h1><p class="lage">' + lage + '</p>';
    h += '<div class="zeiten" role="list">' + zeiten.map(t => {
      const st = jetzt >= t + dauer ? "fertig" : jetzt >= t ? "live" : "kommt";
      const zu = st === "fertig" ? "fertig" : st === "live" ? "Live" : "";
      return '<div class="zeit ' + st + '" role="listitem"><span class="tag">' + tag(t) + '</span><span class="uhr">' + uhr(t) + '</span><span class="zu">' + (zu || "&nbsp;") + '</span></div>';
    }).join("") + '</div>';
    if (ichM) {
      h += '<div class="ich">' + managerAva(ichM.id, ichM.name, "s44") + '<div><div class="wer">Platz ' + ichM.platz + ' von ' + ms.length + '</div><div class="was">noch ' +
        NF1.format(ichM.l + ichM.o) + ' Mio im Spiel</div></div><span class="zahl p-tag">' + NF.format(ichM.punkte) + '</span></div>';
    }
    h += '</div>';
    h += '<div class="legende" aria-hidden="true"><span><i style="background:var(--gespielt)"></i>gespielt</span><span><i style="background:var(--live)"></i>läuft</span><span><i style="background:var(--offen)"></i>noch offen</span></div>';
    h += '<ol class="liste">';
    const fuehrer = ms[0].punkte;
    ms.forEach(m => {
      const auf = offen.has(m.id);
      const w = v => (v / max * 100).toFixed(2) + "%";
      const leer = Math.max(0, max - m.summe);
      const teile = [];
      const rest = m.l + m.o;
      if (rest > 0) teile.push('<span style="color:var(--text)">noch ' + NF1.format(rest) + ' Mio</span>');
      if (m.nL) teile.push('<span class="live-t"><span class="puls"></span>' + m.nL + ' läuft</span>');
      if (m.nO) teile.push('<span>' + m.nO + ' offen</span>');
      if (!m.nL && !m.nO) teile.push('<span>alle durch</span>');
      if (m.punkte < fuehrer) teile.push('<span>−' + NF.format(fuehrer - m.punkte) + '</span>');
      h += '<li class="rz' + (m.id === ich ? " meins" : "") + '"><button class="reihe mit-bar" aria-expanded="' + auf + '" data-m="' + esc(m.id) + '">' +
        managerAva(m.id, m.name, "s48") +
        '<span class="name">' + esc(m.name) + duTag(m.id) + '</span>' +
        '<span class="info">' + rp(m.platz) + teile.join("") + '</span>' +
        '<span class="wert zahl p-tag">' + NF.format(m.punkte) + '</span>' +
        '<span class="bar" role="img" aria-label="' + NF1.format(m.g) + ' Mio gespielt, ' + NF1.format(m.l) + ' Mio laufen, ' + NF1.format(m.o) + ' Mio offen">' +
          (m.g ? '<span class="g" style="width:' + w(m.g) + '"></span>' : "") +
          (m.l ? '<span class="l" style="width:' + w(m.l) + '"></span>' : "") +
          (m.o ? '<span class="o" style="width:' + w(m.o) + '"></span>' : "") +
          (leer > 0.05 ? '<span class="leer" style="width:' + w(leer) + '"></span>' : "") + '</span>' +
        '</button>' + (auf ? details(m, jetzt) : "") + '</li>';
    });
    h += '</ol>';
    setzen(el, h);
  }
  const posNr = p => ({ TW: 1, ABW: 2, MF: 3, ST: 4 }[p] || 9);
  function details(m, jetzt) {
    let h = '<div class="details"><div class="seg klein" role="group" aria-label="Darstellung">' +
      '<button data-detail="feld" aria-pressed="' + (detailAnsicht === "feld") + '">Spielfeld</button>' +
      '<button data-detail="liste" aria-pressed="' + (detailAnsicht === "liste") + '">Anstoßzeiten</button></div>';
    h += detailAnsicht === "feld" ? liveFeld(m, jetzt) : liveListe(m, jetzt);
    h += '<button class="knopf' + (m.id === ich ? "" : " gold") + '" data-ich="' + esc(m.id) + '">' + (m.id === ich ? "Markierung entfernen" : "Das bin ich") + '</button>' +
      (H && H.manager && H.manager[m.id] ? '<button class="knopf" data-profil="' + esc(m.id) + '">Saison-Profil ›</button>' : "") + '</div>';
    return h;
  }
  function liveFeld(m, jetzt) {
    const nach = { TW: [], ABW: [], MF: [], ST: [] };
    m.spieler.forEach(sp => (nach[sp.pos] || nach.MF).push(sp));
    const zelle = sp => {
      const s = status(sp, jetzt);
      const w = s === "offen"
        ? '<span class="wt klein">' + (sp.anstoss ? tag(sp.anstoss) + " " + uhr(sp.anstoss) : NF1.format(sp.preis || 0) + " Mio") + '</span>'
        : '<span class="wt ' + pk(sp.punkte || 0) + '">' + (s === "live" ? '<span class="puls"></span>' : "") + NF.format(sp.punkte || 0) + '</span>';
      return '<div class="fs">' + spielerAva(sp.id, sp.n, "s44", { kap: sp.k, verein: sp.verein }) + '<span class="nm">' + esc(sp.n) + '</span>' + w + '</div>';
    };
    return feldRahmen([nach.ABW.length, nach.MF.length, nach.ST.length].join("-"), [nach.ST, nach.MF, nach.ABW, nach.TW].map(r => r.map(zelle)),
      "", '<div class="summe"><b>' + NF.format(m.punkte) + '</b><span>Punkte</span></div>', "Aufstellung von " + m.name);
  }
  function liveListe(m, jetzt) {
    const gruppen = new Map();
    m.spieler.slice().sort((a, b) => (a.anstoss || 9e15) - (b.anstoss || 9e15) || posNr(a.pos) - posNr(b.pos))
      .forEach(sp => { const k = sp.anstoss || 0; if (!gruppen.has(k)) gruppen.set(k, []); gruppen.get(k).push(sp); });
    let h = "";
    gruppen.forEach((liste, t) => {
      const st = t ? status(liste[0], jetzt) : "offen";
      const titel = t ? tag(t) + " " + uhr(t) : "ohne Termin";
      h += '<div class="gruppe"><h3>' + titel + ' · ' + (st === "live" ? '<span class="live-t">läuft</span>' : st) + '</h3>';
      liste.forEach(sp => {
        const s = status(sp, jetzt);
        const p = s === "offen" ? NF1.format(sp.preis || 0) + " Mio" : NF.format(sp.punkte || 0);
        h += '<div class="sp ' + s + '">' + spielerAva(sp.id, sp.n, "s40", { kap: sp.k, verein: sp.verein }) +
          '<span class="n"><span>' + esc(sp.n) + '</span><em>' + esc(sp.pos) + ' · ' + esc(sp.verein) +
          (sp.gegner ? " gegen " + esc(sp.gegner) + (sp.ort ? " (" + esc(sp.ort) + ")" : "") : "") + (sp.k ? " · Kapitän ×2" : "") + '</em></span>' +
          '<span class="p ' + (s === "offen" ? "" : pk(sp.punkte || 0)) + '">' + p + '</span></div>';
      });
      h += '</div>';
    });
    return h;
  }

  // ------------------------------------------------------------ Spielfeld (Live und Statistik)
  const FELD_SVG = '<svg class="linien" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
    '<rect x="1.5" y="1" width="97" height="98"/><path d="M1.5 50H98.5"/><ellipse cx="50" cy="50" rx="13" ry="8.5"/>' +
    '<rect x="24" y="1" width="52" height="14"/><rect x="38" y="1" width="24" height="5"/><path d="M41 15a9 4 0 0 0 18 0"/>' +
    '<rect x="24" y="85" width="52" height="14"/><rect x="38" y="94" width="24" height="5"/><path d="M41 85a9 4 0 0 1 18 0"/></svg>';
  function feldRahmen(f, reihen, info, extra, label) {
    return '<div class="feld" role="img" aria-label="' + esc(label || "Aufstellung") + '">' + FELD_SVG + '<span class="formation">' + esc(f) + '</span>' +
      (info ? '<span class="feldinfo">' + info + '</span>' : "") +
      reihen.filter(r => r.length).map(r => '<div class="freihe">' + r.join("") + '</div>').join("") + (extra || "") + '</div>';
  }

  // ------------------------------------------------------------ Strafen
  function strafenAuswerten() {
    const s = {};
    const tage = (D.strafen && D.strafen.tage) || [];
    tage.forEach(t => t.liste.forEach(e => {
      const x = s[e.id] = s[e.id] || { id: e.id, name: e.name, summe: 0, karten: [], letzter: 0 };
      x.name = e.name;
      if (e.betrag > 0) { x.summe += e.betrag; x.karten.push({ d: t.d, b: e.betrag, letzter: e.platzVonUnten === 1 }); }
      if (e.platzVonUnten === 1) x.letzter++;
    }));
    const liste = Object.values(s).sort((a, b) => b.summe - a.summe || b.letzter - a.letzter || a.name.localeCompare(b.name, "de"));
    return { liste, tage, kasse: liste.reduce((a, x) => a + x.summe, 0) };
  }
  function renderStrafen() {
    const el = document.getElementById("v-strafen");
    const S = strafenAuswerten();
    const b = (D.strafen && D.strafen.betraege) || [10, 8, 5, 3];

          '<span>' + x.karten.length + "× gezahlt" + (x.letzter ? ", " + x.letzter + "× Letzter" : "") + '</span>' : '<span>bisher straffrei</span>') +

        managerAva(e.id, e.name, "s28") + '<span class="name">' + esc(e.name) + '</span><span class="pk">' + NF.format(e.pkt) + ' Pkt</span></li>').join("") + '</ol>';
      h += '</div>';
    });
    setzen(el, h);
  }

  // ------------------------------------------------------------ Saison
  function saisonAuswerten() {
    const rows = D.saison || [];
    const tage = [...new Set(rows.map(r => r.d))].sort((a, b) => a - b);
    const m = {};
    rows.forEach(r => { const x = m[r.id] = m[r.id] || { id: r.id, name: r.name, je: {} }; x.je[r.d] = r.pkt; x.name = r.name; });
    const sieger = {}, schnitt = {};
    tage.forEach(d => {
      const werte = Object.values(m).filter(x => d in x.je).map(x => x.je[d]);
      const top = Math.max(...werte);
      schnitt[d] = werte.reduce((a, v) => a + v, 0) / werte.length;
      Object.values(m).forEach(x => { if (x.je[d] === top) sieger[x.id] = (sieger[x.id] || 0) + 1; });
    });
    const liste = Object.values(m).map(x => {
      const w = tage.filter(d => d in x.je).map(d => x.je[d]);
      const best = Math.max(...w);
      return Object.assign(x, { gesamt: w.reduce((a, v) => a + v, 0), schnitt: w.length ? w.reduce((a, v) => a + v, 0) / w.length : 0,
        siege: sieger[x.id] || 0, best: best, bestTag: tage.find(d => x.je[d] === best) });
    }).sort((a, b) => b.gesamt - a.gesamt);
    return { tage, liste, schnitt };
  }
  function renderSaison() {
    const el = document.getElementById("v-saison");
    const S = saisonAuswerten();
    if (!S.tage.length) { setzen(el, hinweis("Noch keine fertigen Spieltage", "Die Statistik füllt sich nach dem ersten abgerechneten Spieltag.")); return; }
    if (!gewaehlt || !S.liste.some(x => x.id === gewaehlt)) gewaehlt = S.liste.some(x => x.id === ich) ? ich : S.liste[0].id;
    const g = S.liste.find(x => x.id === gewaehlt);
    let h = '<div class="held"><h1>Saison</h1><p class="lage">Punkte je Spieltag. Antippen zeigt die Werte.</p></div>';
    h += '<div class="chart-box" id="chart">' + chartSvg(S, g) + '<div class="tip" id="tip" hidden></div></div>';
    h += '<div class="legende"><span><i style="background:var(--gold)"></i>' + esc(g.name) + '</span><span><i style="background:var(--grau);height:2px"></i>Schnitt der Liga</span><span><i style="background:var(--gespielt);height:2px"></i>alle anderen</span></div>';
    h += '<h2>Gesamtwertung</h2><table class="saison"><thead><tr><th></th><th>Manager</th><th>Gesamt</th><th>Ø</th><th>Siege</th><th>Bester</th></tr></thead><tbody>' +
      S.liste.map((x, i) => '<tr data-g="' + esc(x.id) + '" class="' + (x.id === gewaehlt ? "gewaehlt" : "") + '"><td>' + rp(i + 1) + '</td><td><span class="mn">' +
        managerAva(x.id, x.name, "s28") + '<span>' + esc(x.name) + '</span></span></td><td class="gesamt">' + NF.format(x.gesamt) + '</td><td>' + NF0(x.schnitt) +
        '</td><td>' + x.siege + '</td><td>' + NF.format(x.best) + '</td></tr>').join("") +
      '</tbody></table><p class="erklaer">Abgerechnete Spieltage 1 bis ' + S.tage[S.tage.length - 1] + '. Zeile antippen, um den Manager im Diagramm hervorzuheben.</p>';
    if (setzen(el, h)) chartTouch(S, g);
  }
  const CH = { w: 360, h: 220, l: 40, r: 12, t: 12, b: 26 };
  function skalen(S) {
    const alle = S.liste.flatMap(x => S.tage.filter(d => d in x.je).map(d => x.je[d]));
    let lo = Math.min(...alle), hi = Math.max(...alle);
    const schritt = hi - lo > 1500 ? 500 : 250;
    lo = Math.floor(lo / schritt) * schritt; hi = Math.ceil(hi / schritt) * schritt;
    const x = d => S.tage.length === 1 ? (CH.l + CH.w - CH.r) / 2 : CH.l + (S.tage.indexOf(d) / (S.tage.length - 1)) * (CH.w - CH.l - CH.r);
    const y = v => CH.t + (1 - (v - lo) / (hi - lo || 1)) * (CH.h - CH.t - CH.b);
    return { x, y, lo, hi, schritt };
  }
  function pfad(S, sk, je) {
    return S.tage.filter(d => d in je).map((d, i) => (i ? "L" : "M") + sk.x(d).toFixed(1) + " " + sk.y(je[d]).toFixed(1)).join(" ");
  }
  function chartSvg(S, g) {
    const sk = skalen(S);
    let s = '<svg viewBox="0 0 ' + CH.w + ' ' + CH.h + '" role="img" aria-label="Punkte je Spieltag, ' + esc(g.name) + ' hervorgehoben">';
    for (let v = sk.lo; v <= sk.hi; v += sk.schritt) {
      s += '<line x1="' + CH.l + '" x2="' + (CH.w - CH.r) + '" y1="' + sk.y(v) + '" y2="' + sk.y(v) + '" stroke="#2A2A2D" stroke-width="1"/>' +
        '<text x="' + (CH.l - 6) + '" y="' + (sk.y(v) + 4) + '" text-anchor="end" fill="#8E8E93" font-size="11" font-family="Saira Semi Condensed, Barlow">' + NF.format(v) + '</text>';
    }
    S.tage.forEach(d => { s += '<text x="' + sk.x(d) + '" y="' + (CH.h - 8) + '" text-anchor="middle" fill="#8E8E93" font-size="11" font-family="Saira Semi Condensed, Barlow">' + d + '</text>'; });
    S.liste.filter(x => x.id !== g.id).forEach(x => { s += '<path d="' + pfad(S, sk, x.je) + '" fill="none" stroke="#3A3A3D" stroke-width="1.25" stroke-linejoin="round"/>'; });
    s += '<path d="' + pfad(S, sk, S.schnitt) + '" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-dasharray="4 4"/>';
    s += '<path d="' + pfad(S, sk, g.je) + '" fill="none" stroke="#F7C51E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    S.tage.filter(d => d in g.je).forEach(d => { s += '<circle cx="' + sk.x(d) + '" cy="' + sk.y(g.je[d]) + '" r="4" fill="#F7C51E" stroke="#121212" stroke-width="2"/>'; });
    s += '<line id="fadenkreuz" x1="0" x2="0" y1="' + CH.t + '" y2="' + (CH.h - CH.b) + '" stroke="#F5F5F5" stroke-opacity=".5" stroke-width="1" visibility="hidden"/>';
    s += '<rect x="' + CH.l + '" y="0" width="' + (CH.w - CH.l - CH.r) + '" height="' + CH.h + '" fill="transparent" id="flaeche"/></svg>';
    return s;
  }
  function chartTouch(S, g) {
    const box = document.getElementById("chart");
    const svg = box.querySelector("svg"), tip = document.getElementById("tip"), fk = svg.querySelector("#fadenkreuz");
    const sk = skalen(S);
    function zeig(ev) {
      const r = svg.getBoundingClientRect();
      const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * CH.w;
      let d = S.tage[0], best = 1e9;
      S.tage.forEach(t => { const a = Math.abs(sk.x(t) - px); if (a < best) { best = a; d = t; } });
      const werte = S.liste.filter(x => d in x.je).map(x => x.je[d]).sort((a, b) => b - a);
      const v = g.je[d];
      const platz = v == null ? null : werte.indexOf(v) + 1;
      fk.setAttribute("x1", sk.x(d)); fk.setAttribute("x2", sk.x(d)); fk.setAttribute("visibility", "visible");
      tip.hidden = false;
      tip.innerHTML = 'Spieltag ' + d + '<br><b>' + (v == null ? "–" : NF.format(v)) + '</b> ' + esc(g.name) + (platz ? ', Platz ' + platz : "") +
        '<br><span class="leise">Schnitt ' + NF0(S.schnitt[d]) + ', bester ' + NF.format(werte[0]) + '</span>';
      const links = sk.x(d) / CH.w * r.width;
      tip.style.left = Math.min(Math.max(0, links - 80), r.width - tip.offsetWidth) + "px";
    }
    svg.addEventListener("pointerdown", zeig);
    svg.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || e.buttons) zeig(e); });
    const weg = () => { tip.hidden = true; fk.setAttribute("visibility", "hidden"); };
    svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") weg(); });   // Touch: bleibt stehen
    tipWeg = weg;
  }

  // ------------------------------------------------------------ Statistik-Daten (Historie)
  // Zeile z: [Spieltag, Manager, Spieler, Punkte, Tore, Vorlagen, Kapitän, Startelf, Minuten, Zu null, Gelb, Rot, Preis]
  let H = null, hLaedt = false, hFehler = null, statKey = "", statVal = null;
  const SX = {
    sp: store.get("kb_sp") || "beliebt", mg: store.get("kb_mg") || "scorer", zeit: store.get("kb_zeit") || "saison",
    alle: false, auf: null, profil: null,
  };
  const POS = ["TW", "ABW", "MF", "ST"];
  const FORMATIONEN = ["4-4-2", "4-3-3", "3-4-3", "3-5-2", "4-5-1", "5-3-2", "5-4-1", "3-6-1", "4-2-4", "5-2-3"];
  const MIN_TAGE = () => SX.zeit === "form" ? 2 : 3;

  function hSetzen(h) {
    const info = h.spieler || {};
    h.rows = (h.z || []).map(r => {
      const s = info[r[2]] || ["Unbekannt", "", ""];
      return { d: r[0], m: String(r[1]), p: String(r[2]), pkt: r[3] || 0, t: r[4] || 0, v: r[5] || 0, k: r[6] ? 1 : 0, s: r[7], min: r[8],
        zn: r[9] || 0, g: r[10] || 0, r: r[11] || 0, preis: r[12], name: s[0], pos: s[1], verein: s[2] || "–" };
    });
    H = h; statKey = "";
    bilderUebernehmen(h.bilder);
  }
  async function historieLaden(erzwingen) {
    const soll = D && D.historie;
    if (!soll || !soll.zeilen || hLaedt) return;
    if (!erzwingen && H && H.version === soll.version) return;
    hLaedt = true; hFehler = null;
    if (!H) renderStats();
    try {
      const h = await holen("historie");
      if (!h || h.ok === false) throw new Error((h && h.fehler) || "Keine Statistikdaten");
      hSetzen(h);
      store.set("kb_hist", JSON.stringify({ version: h.version, manager: h.manager, spieler: h.spieler, z: h.z, bilder: h.bilder }));
    } catch (e) {
      hFehler = e.message;
    }
    hLaedt = false;
    rendern();
  }

  function stat() {
    const key = H.version + "|" + SX.zeit;
    if (key === statKey) return statVal;
    const namen = Object.assign({}, H.manager);
    ((D && D.saison) || []).forEach(x => { namen[x.id] = x.name; });
    ((D && D.manager) || []).forEach(x => { namen[x.id] = x.name; });
    const alleTage = [...new Set(H.rows.map(r => r.d))].sort((a, b) => a - b);
    const tage = SX.zeit === "form" ? alleTage.slice(-3) : alleTage;
    const tset = new Set(tage);
    const rows = H.rows.filter(r => tset.has(r.d));

    const sd = new Map();          // ein Eintrag je Spieler und Spieltag
    rows.forEach(r => {
      const k = r.p + "|" + r.d;
      let x = sd.get(k);
      if (!x) sd.set(k, x = { r, wer: [], kap: 0 });
      x.wer.push(r.m); if (r.k) x.kap++;
    });

    const sp = new Map();
    sd.forEach(x => {
      const r = x.r;
      let s = sp.get(r.p);
      if (!s) sp.set(r.p, s = { id: r.p, name: r.name, pos: r.pos, verein: r.verein, picks: 0, tage: 0, pkt: 0, t: 0, v: 0,
        kap: 0, kapBonus: 0, best: -1e9, bestTag: 0, wer: new Map(), je: [] });
      s.picks += x.wer.length; s.tage++; s.pkt += r.pkt; s.t += r.t; s.v += r.v; s.kap += x.kap; s.kapBonus += x.kap * r.pkt;
      if (r.pkt > s.best) { s.best = r.pkt; s.bestTag = r.d; }
      x.wer.forEach(m => s.wer.set(m, (s.wer.get(m) || 0) + 1));
      s.je.push({ d: r.d, pkt: r.pkt, n: x.wer.length });
    });
    sp.forEach(s => s.je.sort((a, b) => a.d - b.d));

    const mg = new Map();
    rows.forEach(r => {
      let m = mg.get(r.m);
      if (!m) mg.set(r.m, m = { id: r.m, name: namen[r.m] || r.m, t: 0, v: 0, zn: 0, g: 0, r: 0, kapBonus: 0, kapBest: null,
        exPkt: 0, exN: 0, exBest: null, pkt: 0, preis: 0, pktPreis: 0, preisTage: new Set(), picks: 0, tage: new Set(),
        pos: { TW: 0, ABW: 0, MF: 0, ST: 0 }, vereine: new Map(), spieler: new Map(), kapJe: [], einzel: [] });
      const eff = r.pkt * (r.k ? 2 : 1);
      const e = { r, eff };
      m.t += r.t; m.v += r.v; m.zn += r.zn; m.g += r.g; m.r += r.r; m.picks++; m.tage.add(r.d); m.pkt += eff;
      if (r.k) { m.kapBonus += r.pkt; m.kapJe.push(e); if (!m.kapBest || r.pkt > m.kapBest.r.pkt) m.kapBest = e; }
      if (sd.get(r.p + "|" + r.d).wer.length === 1) { m.exPkt += eff; m.exN++; if (!m.exBest || eff > m.exBest.eff) m.exBest = e; }
      if (r.preis > 0) { m.preis += r.preis; m.pktPreis += eff; m.preisTage.add(r.d); }
      if (r.pos in m.pos) m.pos[r.pos] += eff;
      m.vereine.set(r.verein, (m.vereine.get(r.verein) || 0) + 1);
      let ms = m.spieler.get(r.p);
      if (!ms) m.spieler.set(r.p, ms = { id: r.p, name: r.name, pos: r.pos, verein: r.verein, n: 0, pkt: 0, kap: 0 });
      ms.n++; ms.pkt += eff; ms.kap += r.k;
      m.einzel.push(e);
    });

    const vr = new Map();
    rows.forEach(r => {
      let c = vr.get(r.verein);
      if (!c) vr.set(r.verein, c = { id: r.verein, name: r.verein, picks: 0, pkt: 0, kap: 0, spieler: new Map() });
      c.picks++; c.pkt += r.pkt; c.kap += r.k;
      c.spieler.set(r.p, (c.spieler.get(r.p) || 0) + 1);
    });

    const saison = {};             // offizielle Spieltagspunkte im Zeitraum
    ((D && D.saison) || []).forEach(x => {
      if (!tset.has(x.d)) return;
      const s = saison[x.id] = saison[x.id] || { sum: 0, n: 0, best: -1e9, bestTag: 0 };
      s.sum += x.pkt; s.n++;
      if (x.pkt > s.best) { s.best = x.pkt; s.bestTag = x.d; }
    });

    statVal = { tage, alleTage, rows, sd, sp: [...sp.values()], mg: [...mg.values()], vr: [...vr.values()], saison,
      hatPreis: rows.some(r => r.preis > 0) };
    statKey = key;
    return statVal;
  }

  // ------------------------------------------------------------ Statistik-Bausteine
  function statLeer() {
    if (!D) return '<p class="laedt-text">Daten werden geladen …</p>';
    if (!D.historie) return hinweis("Statistik noch nicht eingerichtet", "Den neuen Apps-Script-Code einfügen und unter Bereitstellungen eine neue Version der Web-App erstellen.");
    if (!D.historie.zeilen) return hinweis("Noch keine Statistikdaten", "Im Google Sheet einmal Kickbase → 📊 Statistik-Daten nachladen ausführen. Danach kommen neue Spieltage jeden Montag automatisch dazu.");
    if (!H) return hLaedt ? '<p class="laedt-text">Statistik wird geladen …</p>'
      : hinweis("Statistik konnte nicht geladen werden", esc(hFehler || "Unbekannter Fehler") + '.<br><button class="knopf" id="histNochmal">Erneut laden</button>');
    return "";
  }
  function zeitSchalter(S) {
    return S.alleTage.length > 3
      ? '<div class="seg klein" role="group" aria-label="Zeitraum"><button data-zeit="saison" aria-pressed="' + (SX.zeit === "saison") +
        '">Saison</button><button data-zeit="form" aria-pressed="' + (SX.zeit === "form") + '">Letzte 3</button></div>' : "";
  }
  function zeitText(S) {
    const von = S.tage[0], bis = S.tage[S.tage.length - 1];
    return (von === bis ? "Spieltag " + von : "Spieltag " + von + " bis " + bis) + ", " + NF.format(S.rows.length) + " Aufstellungsplätze ausgewertet";
  }
  function statKopf(titel, S, extra) {
    return '<div class="held"><div class="statzeile"><h1>' + titel + '</h1>' + zeitSchalter(S) + '</div><p class="lage">' + zeitText(S) + '</p>' + (extra || "") + '</div>';
  }
  function chips(liste, aktiv, attr) {
    return '<div class="seg" role="group" aria-label="Auswertung">' + liste.map(([k, t]) =>
      '<button data-' + attr + '="' + k + '" aria-pressed="' + (k === aktiv) + '">' + t + '</button>').join("") + '</div>';
  }
  // items: { id, attr, ava, titel, wert, wcls, n, teile: [{ v, c }], sub, meins, aufzu }
  function rangliste(items, mehrText) {
    if (!items.length) return hinweis("Keine Daten", "Für diesen Zeitraum gibt es hier noch nichts auszuwerten.");
    const summe = it => it.teile.reduce((a, x) => a + x.v, 0);
    const max = Math.max(...items.map(summe)) || 1;
    const zeig = SX.alle ? items : items.slice(0, 15);
    let platz = 0, vorher = null;
    let h = '<ol class="liste">';
    zeig.forEach((it, i) => {
      if (it.n !== vorher) { platz = i + 1; vorher = it.n; }
      const auf = it.aufzu && SX.auf === it.attr + ":" + it.id;
      h += '<li class="rz' + (it.meins ? " meins" : "") + '"><button class="reihe mit-bar" data-' + it.attr + '="' + esc(it.id) + '"' +
        (it.aufzu ? ' aria-expanded="' + !!auf + '"' : "") + '>' + it.ava + '<span class="name">' + it.titel + '</span>' +
        '<span class="info">' + rp(platz) + it.sub + '</span><span class="wert zahl ' + (it.wcls || "") + '">' + it.wert + '</span><span class="bar" aria-hidden="true">' +
        it.teile.filter(x => x.v > 0).map(x => '<span class="' + (x.c || "einzeln") + '" style="width:' + (x.v / max * 100).toFixed(2) + '%"></span>').join("") +
        '</span></button>' + (auf ? it.aufzu() : "") + '</li>';
    });
    h += '</ol>';
    if (!SX.alle && items.length > 15) h += '<button class="mehr" data-mehr="1">Alle ' + items.length + ' ' + mehrText + ' zeigen</button>';
    return h;
  }
  const spTitel = s => esc(s.name) + '<em>' + esc(s.pos) + ' · ' + esc(s.verein) + '</em>';
  const spAvaS = (s, cls) => spielerAva(s.id, s.name, cls || "s48", { verein: s.verein });
  const beiDir = s => { const n = ich && s.wer ? s.wer.get(ich) : 0; return n ? '<span class="du">bei dir ' + n + '×</span>' : ""; };

  function elf(liste, w) {
    const nach = { TW: [], ABW: [], MF: [], ST: [] };
    liste.forEach(x => { if (nach[x.pos]) nach[x.pos].push(x); });
    Object.values(nach).forEach(a => a.sort((a, b) => w(b) - w(a) || (b.pkt || 0) - (a.pkt || 0)));
    let best = null;
    FORMATIONEN.forEach(f => {
      const [a, mi, s] = f.split("-").map(Number);
      if (!nach.TW.length || nach.ABW.length < a || nach.MF.length < mi || nach.ST.length < s) return;
      const teil = { TW: nach.TW.slice(0, 1), ABW: nach.ABW.slice(0, a), MF: nach.MF.slice(0, mi), ST: nach.ST.slice(0, s) };
      const sum = POS.reduce((acc, p) => acc + teil[p].reduce((x, y) => x + w(y), 0), 0);
      if (!best || sum > best.sum + 1e-9) best = Object.assign({ f, sum }, teil);
    });
    return best;
  }
  function feld(e, zahl, titel, info, o) {
    if (!e) return "";
    o = o || {};
    const zelle = x => '<div class="fs">' + spielerAva(x.id, x.name, "s44", { kap: o.kapId && x.id === o.kapId, verein: x.verein }) +
      '<span class="nm">' + esc(x.name) + '</span><span class="wt ' + (o.farbe ? o.farbe(x) : "") + '">' + zahl(x) + '</span></div>';
    return feldRahmen(e.f, [e.ST, e.MF, e.ABW, e.TW].map(r => r.map(zelle)), info, "",
      titel + " (" + e.f + "): " + POS.flatMap(p => e[p].map(x => x.name)).join(", "));
  }

        sub: '<span>' + tageTxt(s.tage) + '</span><span>bester ' + NF.format(s.best) + ' (ST ' + s.bestTag + ')</span>' + beiDir(s), aufzu: spAuf(s),

        id: s.id, attr: "spx", n: s.t + s.v, ava: spAvaS(s), titel: spTitel(s), wert: String(s.t + s.v), teile: [{ v: s.t, c: "tor" }, { v: s.v, c: "vor" }],
        sub: '<span>' + s.t + (s.t === 1 ? " Tor" : " Tore") + ', ' + s.v + (s.v === 1 ? " Vorlage" : " Vorlagen") + '</span><span>' + s.picks + '× aufgestellt</span>' + beiDir(s), aufzu: spAuf(s),

        id: s.id, attr: "spx", n: s.kap, ava: spielerAva(s.id, s.name, "s48", { kap: true, verein: s.verein }), titel: spTitel(s), wert: s.kap + "<small>×</small>", teile: [{ v: s.kap }],
        sub: '<span>Bonus <b class="' + pk(s.kapBonus / s.kap) + '">' + NF.format(s.kapBonus) + '</b></span><span>Ø ' + NF0(s.kapBonus / s.kap) + ' je Einsatz</span>', aufzu: spAuf(s),

        id: c.id, attr: "vx", n: c.picks, ava: vereinAva(c.name, "s44"), titel: esc(c.name), wert: NF1.format(c.picks / ges * 100) + "<small>%</small>", teile: [{ v: c.picks }],
        sub: '<span>' + c.picks + ' Einsätze</span><span>Ø <b class="' + pk(c.pkt / c.picks) + '">' + NF0(c.pkt / c.picks) + '</b> Pkt</span><span>' + c.spieler.size + ' Spieler</span>',
        aufzu: () => '<div class="aufzu"><h3>Meistaufgestellte Spieler</h3><ul class="wer">' + [...c.spieler.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([p, n]) =>
          '<li><span>' + esc((S.sp.find(x => x.id === p) || { name: p }).name) + '</span><span>' + n + '×</span></li>').join("") + '</ul></div>',
      }));
    }
    h += rangliste(items, SX.sp === "vereine" ? "Vereine" : "Spieler");
    if (setzen(el, h)) chipSichtbar(el);
  }

      }));

        n: m.exPkt, wert: NF.format(m.exPkt), wcls: "p-tag", teile: [{ v: Math.max(0, m.exPkt) }],
        sub: '<span>' + m.exN + ' exklusive Einsätze</span>' + (m.exBest ? '<span>bester: ' + esc(m.exBest.r.name) + ' ' + NF.format(m.exBest.eff) + '</span>' : ""),

      h += '<p class="erklaer">Punkte je Million Marktwert, nur Spieltage mit gespeicherten Preisen.</p>';

  function profil(S, m) {
    const alle = S.mg;
    const schnitt = f => alle.reduce((a, x) => a + f(x), 0) / (alle.length || 1);
    const sa = S.saison[m.id];
    const rangfolge = Object.entries(S.saison).sort((a, b) => b[1].sum - a[1].sum);
    const platz = rangfolge.findIndex(([id]) => id === m.id) + 1;
    const besteTage = Object.values(S.saison);
    const delta = (wert, liga, fmt) => {
      const diff = wert - liga;
      if (Math.abs(diff) < 0.5) return "";
      return '<span class="delta ' + (diff > 0 ? "plus" : "minus") + '">' + (diff > 0 ? "+" : "−") + fmt(Math.abs(diff)) + '</span>';
    };
    const kachel = (w, t, f, fmt) => {
      const liga = schnitt(f);
      return '<div class="kachel"><div class="w">' + w + delta(f(m), liga, fmt) + '</div><div class="t">' + t + '</div><div class="vgl">Liga Ø ' + fmt(liga) + '</div></div>';
    };
    let h = '<button class="zurueck" data-zurueck="1">' + SVG_PFEIL + 'Alle Manager</button>';
    h += '<div class="profilkopf">' + managerAva(m.id, m.name, "s64") + '<div style="min-width:0"><h1>' + esc(m.name) + '</h1><p class="lage">' +
      (sa ? (platz ? "<b>Platz " + platz + "</b> · " : "") + NF.format(sa.sum) + " Punkte · Ø " + NF0(sa.sum / sa.n) : NF.format(m.pkt) + " Punkte") +
      (SX.zeit === "form" ? " · letzte 3 Spieltage" : "") + '</p></div></div>';
    if (S.alleTage.length > 3) h += '<div class="profilzeit">' + zeitSchalter(S) + '</div>';
    h += '<div class="kacheln">' +
      kachel(m.t, "Tore", x => x.t, NF0) +
      kachel(m.v, "Vorlagen", x => x.v, NF0) +
      kachel(m.zn, "Zu null", x => x.zn, v => NF1.format(v)) +
      kachel(NF.format(m.kapBonus), "Kapitän-Bonus", x => x.kapBonus, NF0) +
      kachel(NF.format(m.exPkt), "Exklusiv", x => x.exPkt, NF0) +
      (sa ? (() => {
        const lb = besteTage.reduce((a, x) => a + x.best, 0) / besteTage.length;
        return '<div class="kachel"><div class="w">' + NF.format(sa.best) + delta(sa.best, lb, NF0) + '</div><div class="t">Bester Tag</div><div class="vgl">ST ' +
          sa.bestTag + ' · Liga Ø ' + NF0(lb) + '</div></div>';
      })() : kachel(m.g + m.r, "Karten", x => x.g + x.r, v => NF1.format(v))) + '</div>' +
      '<p class="erklaer" style="margin-top:8px">Plus und Minus im Vergleich zum Liga-Schnitt. Exklusiv: Punkte von Spielern, die am Spieltag kein anderer Manager hatte.</p>';

    // Stamm-Elf
    const meist = [...m.spieler.values()];
    const kapFav = meist.slice().sort((a, b) => b.kap - a.kap || b.pkt - a.pkt)[0];
    h += '<h2>Stamm-Elf</h2><p class="erklaer">Am häufigsten aufgestellt, die Zahl zeigt wie oft.' + (kapFav && kapFav.kap ? ' C: liebster Kapitän (' + esc(kapFav.name) + ', ' + kapFav.kap + '×).' : "") + '</p>';
    h += feld(elf(meist, s => s.n), s => s.n + "×", "Stamm-Elf von " + m.name, NF.format(meist.length) + " Spieler genutzt", { kapId: kapFav && kapFav.kap ? kapFav.id : null });

    // Punkte nach Position
    const nT = m.tage.size || 1;
    const ligaPos = p => schnitt(x => x.pos[p] / (x.tage.size || 1));
    const maxPos = Math.max(...POS.map(p => Math.max(m.pos[p] / nT, ligaPos(p)))) || 1;
    h += '<h2>Punkte nach Position</h2><p class="erklaer">Ø je Spieltag inklusive Kapitän. Der weiße Strich zeigt den Liga-Schnitt.</p>';
    h += POS.map(p => {
      const w = m.pos[p] / nT, l = ligaPos(p);
      return '<div class="spur-z"><span class="posk">' + p + '</span><span class="spur" role="img" aria-label="' + p + ': ' + NF0(w) + ', Liga ' + NF0(l) + '"><span style="width:' +
        (Math.max(0, w) / maxPos * 100).toFixed(1) + '%"></span><i style="left:' + (Math.max(0, l) / maxPos * 100).toFixed(1) + '%"></i></span><span class="zahl">' + NF0(w) + '</span></div>';
    }).join("");
    h += '<div class="karten-zeile"><span><span class="karte klein"></span>' + m.g + ' Gelb</span><span><span class="karte klein rot"></span>' + m.r + ' Rot</span><span>' + m.zn + '× zu null</span></div>';

    // Beste Einzelleistungen
    const ezZeile = (e, unter) => '<div class="ez"><span class="d">ST ' + e.r.d + '</span>' + spielerAva(e.r.p, e.r.name, "s40", { kap: e.r.k, verein: e.r.verein }) +
      '<span class="n"><span>' + esc(e.r.name) + '</span><em>' + unter + '</em></span><span class="p ' + pk(e.r.pkt) + '">' + NF.format(e.eff) + '</span></div>';
    h += '<h2>Beste Einzelleistungen</h2>' + m.einzel.slice().sort((a, b) => b.eff - a.eff).slice(0, 5).map(e => ezZeile(e, esc(e.r.verein) +
      (e.r.t || e.r.v ? " · " + (e.r.t ? e.r.t + (e.r.t === 1 ? " Tor" : " Tore") : "") + (e.r.t && e.r.v ? ", " : "") + (e.r.v ? e.r.v + (e.r.v === 1 ? " Vorlage" : " Vorlagen") : "") : "") +
      (e.r.k ? " · Kapitän ×2" : ""))).join("");

    // Kapitäne je Spieltag
    if (m.kapJe.length) {
      h += '<h2>Kapitäne</h2>' + m.kapJe.slice().sort((a, b) => a.r.d - b.r.d).map(e => ezZeile(e, esc(e.r.verein) + ' · ' + NF.format(e.r.pkt) + ' × 2')).join("");
    }

    // Vereine
    const vv = [...m.vereine.entries()].sort((a, b) => b[1] - a[1]);
    const top = vv.slice(0, 7), rest = vv.slice(7).reduce((a, x) => a + x[1], 0);
    const maxV = Math.max(...top.map(x => x[1]), rest) || 1;
    h += '<h2>Vereine</h2><p class="erklaer">Aufstellungsplätze je Verein, insgesamt ' + vv.length + ' verschiedene.</p>' + top.map(([n, c]) =>
      '<div class="spur-z breit">' + vereinAva(n, "s24") + '<span class="lbl">' + esc(n) + '</span><span class="spur"><span style="width:' + (c / maxV * 100).toFixed(1) +
      '%"></span></span><span class="zahl">' + c + '</span></div>').join("") +
      (rest ? '<div class="spur-z breit"><span></span><span class="lbl leise">Andere (' + (vv.length - 7) + ')</span><span class="spur rest"><span style="width:' +
        (rest / maxV * 100).toFixed(1) + '%"></span></span><span class="zahl">' + rest + '</span></div>' : "");
    if (m.id !== ich) h += '<button class="knopf gold" style="margin-top:24px" data-ich="' + esc(m.id) + '">Das bin ich</button>';
    return h;
  }
  function chipSichtbar(el) {
    const c = el.querySelector(".seg:not(.klein)"), a = c && c.querySelector('[aria-pressed="true"]');
    if (a && a.offsetLeft + a.offsetWidth > c.clientWidth) c.scrollLeft = a.offsetLeft + a.offsetWidth - c.clientWidth + 16;
  }
  function renderStats() { renderSpieler(); renderManager(); }
  function profilAuf(id) {
    SX.profil = id;
    try { history.pushState({ kbProfil: id }, ""); } catch (e) { /* egal */ }
    wechseln("manager");
    renderManager();
  }
  function profilZu() {
    if (history.state && history.state.kbProfil) { history.back(); return; }
    SX.profil = null; renderManager(); window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", e => {
    SX.profil = (e.state && e.state.kbProfil) || null;
    if (D) renderManager();
    window.scrollTo(0, 0);
  });

    if (!D) return;

  }
  function zeigeEinrichtung() {
    document.getElementById("v-live").innerHTML = hinweis("Noch nicht verbunden", "Trag in der Datei config.js die Adresse deiner Apps-Script-Web-App ein.");
    document.getElementById("standText").textContent = "";
  }
  function zeigeFehler(msg) {
    document.getElementById("v-live").innerHTML = hinweis("Daten konnten nicht geladen werden", esc(msg) +
      '. Prüf die Internetverbindung oder die Web-App-Adresse in config.js.<br><button class="knopf" id="nochmal">Erneut laden</button>');
  }
  function wechseln(v) {
    ansicht = v; store.set("kb_ansicht", v);
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
    ["live", "strafen", "saison", "spieler", "manager"].forEach(x => { document.getElementById("v-" + x).hidden = x !== v; });
    chipSichtbar(document.getElementById("v-" + v));
    window.scrollTo(0, 0);
  }
  function statNeu(fn) { fn(); statKey = ""; SX.alle = false; SX.auf = null; renderStats(); }

  document.addEventListener("click", e => {
    const t = e.target.closest("button, tr[data-g]");
    if (!t) return;
    if (t.dataset.v) {
      if (t.dataset.v === "manager" && ansicht === "manager" && SX.profil) { profilZu(); return; }
      wechseln(t.dataset.v); return;
    }
    if (t.id === "stand" || t.id === "nochmal") { laden(); return; }
    if (t.id === "histNochmal") { historieLaden(true); return; }
    if (t.dataset.detail) { detailAnsicht = t.dataset.detail; store.set("kb_detail", detailAnsicht); renderLive(); return; }
    if (t.dataset.zeit) { statNeu(() => { SX.zeit = t.dataset.zeit; store.set("kb_zeit", SX.zeit); }); return; }
    if (t.dataset.sicht) { statNeu(() => { SX.sp = t.dataset.sicht; store.set("kb_sp", SX.sp); }); return; }
    if (t.dataset.msicht) { statNeu(() => { SX.mg = t.dataset.msicht; store.set("kb_mg", SX.mg); }); return; }
    if (t.dataset.mehr) { SX.alle = true; renderStats(); return; }
    if (t.dataset.spx || t.dataset.vx) {
      const k = t.dataset.spx ? "spx:" + t.dataset.spx : "vx:" + t.dataset.vx;
      SX.auf = SX.auf === k ? null : k; renderSpieler(); return;
    }
    if (t.dataset.profil) { profilAuf(t.dataset.profil); window.scrollTo(0, 0); return; }
    if (t.dataset.zurueck) { profilZu(); return; }
    if (t.dataset.m) { offen.has(t.dataset.m) ? offen.delete(t.dataset.m) : offen.add(t.dataset.m); renderLive(); return; }
    if (t.dataset.ich !== undefined) { ich = ich === t.dataset.ich ? null : t.dataset.ich; store.set("kb_ich", ich); gewaehlt = null; rendern(); return; }
    if (t.dataset.tag) {
      const d = Number(t.dataset.tag);
      if (!offenTage) { const tg = (D.strafen.tage || []).map(x => x.d); offenTage = new Set(tg.length ? [Math.max(...tg)] : []); }
      offenTage.has(d) ? offenTage.delete(d) : offenTage.add(d);
      renderStrafen(); return;
    }
    if (t.dataset.g) { gewaehlt = t.dataset.g; renderSaison(); }
  });
  let tipWeg = () => {};
  document.addEventListener("pointerdown", e => { const box = document.getElementById("chart"); if (!box || !box.contains(e.target)) tipWeg(); }, true);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - ladezeit > 30000) laden(); });
  setInterval(() => { if (document.visibilityState === "visible") laden(); }, 60000);
  setInterval(() => { if (D && document.visibilityState === "visible") { renderLive(); } }, 20000);
  wechseln(ansicht);
  try { const hh = JSON.parse(store.get("kb_hist") || "null"); if (hh && hh.z) hSetzen(hh); } catch (e) { /* egal */ }
  try { const alt = JSON.parse(store.get("kb_daten") || "null"); if (alt && alt.ok) { D = alt; bilderUebernehmen(alt.bilder); rendern(); } } catch (e) { /* egal */ }
  laden();
})();
</script>
