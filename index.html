<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Männer Kickbase</title>
<meta name="description" content="Live-Stand, Strafenkasse und Saisonstatistik der Liga Männer Kickbase">
<meta name="theme-color" content="#0E1733">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kickbase">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root {
  color-scheme: dark;
  --nacht: #0E1733;
  --tafel: #16224A;
  --tafel-hoch: #1C2B5A;
  --linie: #26356A;
  --kreide: #F3F0E8;
  --nebel: #A9B3CF;
  --flutlicht: #FFC247;
  --offen: #3987E5;
  --laeuft: #C98500;
  --gespielt: #36446E;
  --rot: #F0524F;
  --gelb: #F5D547;
  --gruen: #46C98C;
  --display: "Big Shoulders Display", "Barlow", system-ui, sans-serif;
  --text: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --rand: 16px;
  --unten: calc(64px + env(safe-area-inset-bottom));
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--nacht); color: var(--kreide);
  font: 400 16px/1.45 var(--text); min-height: 100vh;
  padding: env(safe-area-inset-top) 0 var(--unten);
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--flutlicht); outline-offset: 2px; border-radius: 4px; }
.zahl { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.leise { color: var(--nebel); }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 var(--rand); }

/* Kopf */
.kopf { position: sticky; top: 0; z-index: 5; background: rgba(14, 23, 51, .92); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--linie); }
.kopf .wrap { display: flex; align-items: center; justify-content: space-between; height: 48px; }
.liga { font: 800 20px/1 var(--display); letter-spacing: .02em; }
.stand { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--nebel); padding: 8px 0 8px 8px; }
.stand svg { width: 16px; height: 16px; }
.stand.laedt svg { animation: drehen 1s linear infinite; }
@keyframes drehen { to { transform: rotate(360deg); } }

/* Spieltag-Kopf */
.held { padding: 22px 0 6px; }
.held h1 { margin: 0; font: 800 46px/0.95 var(--display); letter-spacing: .005em; }
.held .lage { margin: 8px 0 0; font-size: 15px; color: var(--nebel); }
.held .lage b { color: var(--flutlicht); font-weight: 600; }

.zeiten { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 6px; margin: 16px 0 4px; }
.zeit { border: 1px solid var(--linie); border-radius: 8px; padding: 7px 6px 6px; text-align: center; }
.zeit .tag { display: block; font-size: 12px; color: var(--nebel); }
.zeit .uhr { display: block; font: 700 19px/1.1 var(--display); }
.zeit .zu { display: block; font-size: 11px; color: var(--nebel); margin-top: 2px; }
.zeit.fertig { opacity: .55; }
.zeit.live { border-color: var(--flutlicht); background: rgba(255, 194, 71, .1); }
.zeit.live .zu { color: var(--flutlicht); font-weight: 600; }

.ich { margin: 14px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--tafel); display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.ich .wer { font-weight: 600; }
.ich .was { font-size: 14px; color: var(--nebel); text-align: right; }

.legende { display: flex; gap: 14px; margin: 18px 0 6px; font-size: 12px; color: var(--nebel); }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* Rangliste */
.liste { list-style: none; margin: 0; padding: 0; }
.zeile { border-top: 1px solid var(--linie); }
.zeile:last-child { border-bottom: 1px solid var(--linie); }
.zeile.meins { background: linear-gradient(90deg, rgba(255,194,71,.10), rgba(255,194,71,0) 70%); }
.kopfzeile { width: 100%; display: grid; grid-template-columns: 30px 1fr auto; column-gap: 10px; row-gap: 6px; padding: 12px 0; align-items: center; }
.platz { font: 800 22px/1 var(--display); color: var(--nebel); text-align: left; }
.zeile:nth-child(1) .platz { color: var(--flutlicht); }
.name { font-weight: 600; font-size: 16px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.name small { font-weight: 500; color: var(--flutlicht); font-size: 12px; margin-left: 4px; }
.punkte { font: 800 28px/1 var(--display); text-align: right; }
.balken { grid-column: 2 / 4; display: flex; gap: 2px; height: 8px; }
.balken span { display: block; height: 100%; border-radius: 2px; min-width: 0; }
.balken .g { background: var(--gespielt); }
.balken .l { background: var(--laeuft); }
.balken .o { background: var(--offen); }
.balken .leer { background: transparent; border: 1px dashed var(--linie); }
.unterzeile { grid-column: 2 / 4; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--nebel); }
.unterzeile .rest { color: var(--kreide); }
.unterzeile .live { color: var(--flutlicht); font-weight: 600; }
.puls { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--flutlicht); margin-right: 5px; vertical-align: 1px; }
@media (prefers-reduced-motion: no-preference) { .puls { animation: puls 1.6s ease-in-out infinite; } }
@keyframes puls { 50% { opacity: .25; } }

.details { padding: 0 0 14px 40px; }
.gruppe { margin-top: 10px; }
.gruppe h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--nebel); }
.gruppe h3 .live { color: var(--flutlicht); }
.sp { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; font-size: 14px; }
.pos { font-size: 11px; font-weight: 600; color: var(--nebel); border: 1px solid var(--linie); border-radius: 4px; text-align: center; padding: 1px 0; }
.sp .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp .n em { font-style: normal; color: var(--nebel); font-size: 12px; margin-left: 6px; }
.k { display: inline-block; font-size: 11px; font-weight: 700; color: var(--nacht); background: var(--flutlicht); border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
.sp .p { font: 700 18px/1 var(--display); text-align: right; min-width: 48px; }
.sp.live .p { color: var(--flutlicht); }
.sp.offen .p { font: 500 13px/1 var(--text); color: var(--nebel); }
.ichbin { margin-top: 12px; font-size: 13px; color: var(--flutlicht); border: 1px solid var(--linie); border-radius: 999px; padding: 6px 12px; }

/* Strafen */
.kasse { padding: 22px 0 4px; }
.kasse .betrag { font: 800 64px/0.9 var(--display); }
.kasse p { margin: 8px 0 0; color: var(--nebel); font-size: 15px; }
.tarif { display: flex; gap: 6px 14px; flex-wrap: wrap; margin: 16px 0 18px; font-size: 13px; color: var(--nebel); }
.tarif > span { display: inline-flex; align-items: center; gap: 6px; }
.karte { display: inline-grid; place-items: center; width: 22px; height: 30px; border-radius: 3px; font: 800 13px/1 var(--display); color: #2A1A00; background: var(--gelb); transform: rotate(-6deg); flex: none; }
.karte.rot { background: var(--rot); color: #fff; }
.karte.klein { width: 14px; height: 19px; font-size: 0; transform: rotate(-6deg); border-radius: 2px; }
.strafzeile { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--linie); }
.strafzeile:last-child { border-bottom: 1px solid var(--linie); }
.strafzeile.meins { background: linear-gradient(90deg, rgba(255,194,71,.10), rgba(255,194,71,0) 70%); }
.strafzeile .karten { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 5px; }
.strafzeile .euro { font: 800 26px/1 var(--display); text-align: right; }
.strafzeile .euro.null { color: var(--gruen); }
.strafzeile .info { font-size: 12px; color: var(--nebel); margin-top: 3px; }
h2 { font: 800 26px/1.1 var(--display); margin: 28px 0 10px; }
.tag-block { border-top: 1px solid var(--linie); }
.tag-block:last-child { border-bottom: 1px solid var(--linie); }
.tag-block > button { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-weight: 600; }
.tag-block > button .leise { font-weight: 400; font-size: 14px; }
.tag-block ol { list-style: none; margin: 0 0 12px; padding: 0; }
.tag-block li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 15px; }
.tag-block li .pk { color: var(--nebel); font-size: 14px; }
.pfeil { transition: transform .2s; width: 16px; height: 16px; flex: none; }
[aria-expanded="true"] .pfeil { transform: rotate(180deg); }

/* Saison */
.chart-box { margin: 18px 0 6px; position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart-titel { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.chart-titel h2 { margin-top: 22px; }
.chart-titel .leise { font-size: 13px; }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--tafel-hoch); border: 1px solid var(--linie); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.35; min-width: 140px; }
.tip b { font-family: var(--display); font-size: 18px; }
table.saison { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
table.saison th { font-weight: 500; color: var(--nebel); font-size: 12px; text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--linie); }
table.saison th:nth-child(2), table.saison td:nth-child(2) { text-align: left; }
table.saison td { padding: 10px 4px; text-align: right; border-bottom: 1px solid var(--linie); }
table.saison td:first-child { font: 800 18px/1 var(--display); color: var(--nebel); text-align: left; width: 26px; }
table.saison td.gesamt { font: 800 20px/1 var(--display); }
table.saison tr { cursor: pointer; }
table.saison tr.gewaehlt td { background: rgba(255,194,71,.08); }
table.saison tr.gewaehlt td:nth-child(2) { color: var(--flutlicht); font-weight: 600; }
table.saison td:nth-child(2) { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Hinweise */
.hinweis { margin: 28px 0; padding: 16px; border: 1px dashed var(--linie); border-radius: 10px; color: var(--nebel); font-size: 15px; }
.hinweis strong { color: var(--kreide); display: block; margin-bottom: 4px; font-size: 16px; }
.hinweis button { margin-top: 10px; color: var(--flutlicht); font-weight: 600; }
.fuss { font-size: 12px; color: var(--nebel); text-align: center; padding: 22px 0 10px; }

/* Navigation */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(22, 34, 74, .96); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--linie); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); height: 64px; }
nav.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--nebel); }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--kreide); }
nav.tabs button[aria-selected="true"] svg { color: var(--flutlicht); }
section[hidden] { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header class="kopf">
  <div class="wrap">
    <div class="liga">Männer Kickbase</div>
    <button class="stand" id="stand" aria-label="Jetzt aktualisieren">
      <span id="standText">lädt</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section id="v-live" aria-label="Live"><p class="hinweis" style="border:0">Daten werden geladen …</p></section>
  <section id="v-strafen" aria-label="Strafen" hidden></section>
  <section id="v-saison" aria-label="Saison" hidden></section>
  <p class="fuss" id="fuss"></p>
</main>

<nav class="tabs" aria-label="Bereiche">
  <div class="wrap" role="tablist">
    <button role="tab" data-v="live" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2h5"/></svg>
      Live
    </button>
    <button role="tab" data-v="strafen" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="11" height="16" rx="1.5" transform="rotate(-8 11.5 11)"/></svg>
      Strafen
    </button>
    <button role="tab" data-v="saison" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>
      Saison
    </button>
  </div>
</nav>

<script>
(function () {
  "use strict";
  const API = (window.KB_API || "").trim();
  const NF = new Intl.NumberFormat("de-DE");
  const NF1 = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const EUR = v => (Math.round(v * 100) / 100).toLocaleString("de-DE", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }) + " €";
  const SVG_PFEIL = '<svg class="pfeil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const FUHR = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" });
  const FTAG = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", weekday: "short" });
  const uhr = t => FUHR.format(new Date(t));
  const tag = t => FTAG.format(new Date(t)).replace(".", "");
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* privat */ } },
  };

  let D = null;                 // letzte Daten
  let ladezeit = 0;
  let offen = new Set();        // aufgeklappte Manager
  let offenTage = null;         // null = nur der neueste Spieltag aufgeklappt
  let ich = store.get("kb_ich");
  let gewaehlt = null;          // Manager im Saison-Diagramm
  let ansicht = store.get("kb_ansicht") || "live";

  // ------------------------------------------------------------ Laden
  function jsonp(url) {
    return new Promise((ok, fehler) => {
      const cb = "kbCb" + Math.random().toString(36).slice(2, 8);
      const s = document.createElement("script");
      const t = setTimeout(() => { aufraeumen(); fehler(new Error("Zeitüberschreitung")); }, 15000);
      function aufraeumen() { clearTimeout(t); delete window[cb]; s.remove(); }
      window[cb] = d => { aufraeumen(); ok(d); };
      s.onerror = () => { aufraeumen(); fehler(new Error("Netzwerkfehler")); };
      s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb + "&t=" + Date.now();
      document.head.appendChild(s);
    });
  }
  async function holen() {
    try {
      const r = await fetch(API + (API.includes("?") ? "&" : "?") + "t=" + Date.now(), { redirect: "follow" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      return jsonp(API);
    }
  }
  async function laden() {
    if (!API) { zeigeEinrichtung(); return; }
    const knopf = document.getElementById("stand");
    knopf.classList.add("laedt");
    try {
      const d = await holen();
      if (!d || d.ok === false) throw new Error((d && d.fehler) || "Keine Daten");
      D = d; ladezeit = Date.now();
      store.set("kb_daten", JSON.stringify(d));   // beim nächsten Öffnen sofort sichtbar
      rendern();
    } catch (e) {
      if (!D) zeigeFehler(e.message);
      document.getElementById("standText").textContent = "offline";
    } finally {
      knopf.classList.remove("laedt");
    }
  }

  // ------------------------------------------------------------ Berechnungen
  function status(sp, jetzt) {
    if (!sp.anstoss) return "offen";
    if (jetzt < sp.anstoss) return "offen";
    if (jetzt < sp.anstoss + D.spieldauer * 60000) return "live";
    return "fertig";
  }
  function auswerten(jetzt) {
    const ms = D.manager.map(m => {
      const s = { g: 0, l: 0, o: 0, nL: 0, nO: 0 };
      m.spieler.forEach(sp => {
        const st = status(sp, jetzt);
        const p = sp.preis || 0;
        if (st === "fertig") s.g += p; else if (st === "live") { s.l += p; s.nL++; } else { s.o += p; s.nO++; }
      });
      return Object.assign({}, m, s, { summe: s.g + s.l + s.o });
    });
    ms.sort((a, b) => b.punkte - a.punkte || a.name.localeCompare(b.name, "de"));
    let platz = 0, vorher = null;
    ms.forEach((m, i) => { if (m.punkte !== vorher) { platz = i + 1; vorher = m.punkte; } m.platz = platz; });
    return ms;
  }
  function anstossZeiten() {
    const z = new Set();
    D.manager.forEach(m => m.spieler.forEach(sp => sp.anstoss && z.add(sp.anstoss)));
    return [...z].sort((a, b) => a - b);
  }

  // ------------------------------------------------------------ Live
  function renderLive() {
    const el = document.getElementById("v-live");
    const jetzt = Date.now();
    if (!D.manager.length) {
      el.innerHTML = '<div class="held"><h1>Spieltag ' + esc(D.spieltag || "") + '</h1></div>' +
        '<div class="hinweis"><strong>Noch keine Aufstellungen</strong>Sie erscheinen hier kurz nach dem ersten Anpfiff des Spieltags.</div>';
      return;
    }
    const ms = auswerten(jetzt);
    const zeiten = anstossZeiten();
    const dauer = D.spieldauer * 60000;
    const nLive = zeiten.filter(t => jetzt >= t && jetzt < t + dauer).length;
    const nFertig = zeiten.filter(t => jetzt >= t + dauer).length;
    let lage;
    if (nFertig === zeiten.length) lage = "Spieltag beendet.";
    else if (nLive) lage = "<b>Läuft gerade.</b> " + nFertig + " von " + zeiten.length + " Anstoßzeiten abgeschlossen.";
    else if (nFertig === 0) lage = "Beginnt " + tag(zeiten[0]) + " " + uhr(zeiten[0]) + ".";
    else { const n = zeiten.find(t => t > jetzt); lage = "Weiter geht es " + tag(n) + " " + uhr(n) + "."; }
    const max = Math.max(D.budget, ...ms.map(m => m.summe));
    const ichM = ms.find(m => m.id === ich);

    let h = '<div class="held"><h1>Spieltag ' + esc(D.spieltag || "") + '</h1><p class="lage">' + lage + '</p>';
    h += '<div class="zeiten" role="list">' + zeiten.map(t => {
      const st = jetzt >= t + dauer ? "fertig" : jetzt >= t ? "live" : "kommt";
      const zu = st === "fertig" ? "fertig" : st === "live" ? '<span class="puls"></span>live' : "";
      return '<div class="zeit ' + st + '" role="listitem"><span class="tag">' + tag(t) + '</span><span class="uhr">' + uhr(t) + '</span><span class="zu">' + (zu || "&nbsp;") + '</span></div>';
    }).join("") + '</div>';
    if (ichM) {
      h += '<div class="ich"><span class="wer">Platz ' + ichM.platz + ' von ' + ms.length + '</span><span class="was">' +
        NF.format(ichM.punkte) + ' Punkte, noch ' + NF1.format(ichM.l + ichM.o) + ' Mio im Spiel</span></div>';
    }
    h += '</div>';
    h += '<div class="legende" aria-hidden="true"><span><i style="background:var(--gespielt)"></i>gespielt</span><span><i style="background:var(--laeuft)"></i>läuft</span><span><i style="background:var(--offen)"></i>noch offen</span></div>';
    h += '<ol class="liste">';
    const fuehrer = ms[0].punkte;
    ms.forEach(m => {
      const auf = offen.has(m.id);
      const w = v => (v / max * 100).toFixed(2) + "%";
      const leer = Math.max(0, max - m.summe);
      let unten = m.nL || m.nO
        ? (m.nL ? '<span class="live"><span class="puls"></span>' + m.nL + " läuft</span>" : "") + (m.nL && m.nO ? ", " : "") + (m.nO ? m.nO + " offen" : "")
        : "alle durch";
      const rest = m.l + m.o;
      h += '<li class="zeile' + (m.id === ich ? " meins" : "") + '">' +
        '<button class="kopfzeile" aria-expanded="' + auf + '" data-m="' + esc(m.id) + '">' +
        '<span class="platz">' + m.platz + '</span>' +
        '<span class="name">' + esc(m.name) + (m.id === ich ? "<small>du</small>" : "") + '</span>' +
        '<span class="punkte zahl">' + NF.format(m.punkte) + '</span>' +
        '<span class="balken" role="img" aria-label="' + NF1.format(m.g) + ' Mio gespielt, ' + NF1.format(m.l) + ' Mio laufen, ' + NF1.format(m.o) + ' Mio offen">' +
          (m.g ? '<span class="g" style="width:' + w(m.g) + '"></span>' : "") +
          (m.l ? '<span class="l" style="width:' + w(m.l) + '"></span>' : "") +
          (m.o ? '<span class="o" style="width:' + w(m.o) + '"></span>' : "") +
          (leer > 0.05 ? '<span class="leer" style="width:' + w(leer) + '"></span>' : "") + '</span>' +
        '<span class="unterzeile"><span>' + (rest > 0 ? '<span class="rest">noch ' + NF1.format(rest) + ' Mio</span>, ' : "") + unten +
          (m.kap ? ', K: ' + esc(m.kap) : "") + '</span><span>' + (m.punkte < fuehrer ? "−" + NF.format(fuehrer - m.punkte) : "") + '</span></span>' +
        '</button>' + (auf ? details(m, jetzt) : "") + '</li>';
    });
    h += '</ol>';
    el.innerHTML = h;
  }
  function details(m, jetzt) {
    const gruppen = new Map();
    m.spieler.slice().sort((a, b) => (a.anstoss || 9e15) - (b.anstoss || 9e15) || posNr(a.pos) - posNr(b.pos))
      .forEach(sp => { const k = sp.anstoss || 0; if (!gruppen.has(k)) gruppen.set(k, []); gruppen.get(k).push(sp); });
    let h = '<div class="details">';
    gruppen.forEach((liste, t) => {
      const st = t ? status(liste[0], jetzt) : "offen";
      const titel = t ? tag(t) + " " + uhr(t) : "ohne Termin";
      h += '<div class="gruppe"><h3>' + titel + ', ' + (st === "live" ? '<span class="live">läuft</span>' : st) + '</h3>';
      liste.forEach(sp => {
        const s = status(sp, jetzt);
        const p = s === "offen" ? NF1.format(sp.preis || 0) + " Mio" : NF.format(sp.punkte || 0);
        h += '<div class="sp ' + s + '"><span class="pos">' + esc(sp.pos) + '</span><span class="n">' + esc(sp.n) +
          (sp.k ? '<span class="k" title="Kapitän, zählt doppelt">×2</span>' : "") +
          '<em>' + esc(sp.verein) + (sp.gegner ? " gegen " + esc(sp.gegner) + (sp.ort ? " (" + esc(sp.ort) + ")" : "") : "") + '</em></span>' +
          '<span class="p">' + p + '</span></div>';
      });
      h += '</div>';
    });
    h += '<button class="ichbin" data-ich="' + esc(m.id) + '">' + (m.id === ich ? "Markierung entfernen" : "Das bin ich") + '</button></div>';
    return h;
  }
  const posNr = p => ({ TW: 1, ABW: 2, MF: 3, ST: 4 }[p] || 9);

  // ------------------------------------------------------------ Strafen
  function strafenAuswerten() {
    const s = {};
    const tage = (D.strafen && D.strafen.tage) || [];
    tage.forEach(t => t.liste.forEach(e => {
      const x = s[e.id] = s[e.id] || { id: e.id, name: e.name, summe: 0, karten: [], letzter: 0 };
      x.name = e.name;
      if (e.betrag > 0) { x.summe += e.betrag; x.karten.push({ d: t.d, b: e.betrag, letzter: e.platzVonUnten === 1 }); }
      if (e.platzVonUnten === 1) x.letzter++;
    }));
    const liste = Object.values(s).sort((a, b) => b.summe - a.summe || b.letzter - a.letzter || a.name.localeCompare(b.name, "de"));
    return { liste, tage, kasse: liste.reduce((a, x) => a + x.summe, 0) };
  }
  function renderStrafen() {
    const el = document.getElementById("v-strafen");
    const S = strafenAuswerten();
    const b = (D.strafen && D.strafen.betraege) || [10, 8, 5, 3];
    if (!S.tage.length) { el.innerHTML = '<div class="hinweis"><strong>Noch keine Strafen</strong>Abgerechnet wird montags um 18:30 nach jedem Spieltag.</div>'; return; }
    let h = '<div class="kasse"><div class="betrag zahl">' + EUR(S.kasse) + '</div><p>in der Kasse nach ' + S.tage.length + (S.tage.length === 1 ? " Spieltag" : " Spieltagen") + '</p></div>';
    h += '<div class="tarif">' + b.map((x, i) => '<span><span class="karte' + (i === 0 ? " rot" : "") + '">' + x + '</span>' +
      ["Letzter", "Vorletzter", "3.-Letzter", "4.-Letzter"][i] + '</span>').join("") + '</div>';
    h += '<div>' + S.liste.map((x, i) =>
      '<div class="strafzeile' + (x.id === ich ? " meins" : "") + '"><span class="platz">' + (i + 1) + '</span><div><div class="name">' + esc(x.name) + (x.id === ich ? "<small>du</small>" : "") + '</div>' +
      (x.karten.length ? '<div class="karten">' + x.karten.map(k => '<span class="karte klein' + (k.letzter ? " rot" : "") + '" title="Spieltag ' + k.d + ': ' + EUR(k.b) + '"></span>').join("") + '</div>' +
        '<div class="info">' + x.karten.length + "× gezahlt" + (x.letzter ? ", " + x.letzter + "× Letzter" : "") + '</div>' : '<div class="info">bisher straffrei</div>') +
      '</div><span class="euro zahl' + (x.summe ? "" : " null") + '">' + EUR(x.summe) + '</span></div>').join("") + '</div>';
    h += '<h2>Spieltage</h2>';
    S.tage.slice().reverse().forEach((t, i) => {
      const auf = offenTage ? offenTage.has(t.d) : i === 0;
      const zahler = t.liste.filter(e => e.betrag > 0);
      h += '<div class="tag-block"><button data-tag="' + t.d + '" aria-expanded="' + auf + '"><span>Spieltag ' + t.d +
        ' <span class="leise">' + EUR(zahler.reduce((a, e) => a + e.betrag, 0)) + '</span></span>' + SVG_PFEIL + '</button>';
      if (auf) h += '<ol>' + zahler.map(e => '<li><span class="karte' + (e.platzVonUnten === 1 ? " rot" : "") + '">' + NF.format(e.betrag) + '</span><span class="name">' + esc(e.name) +
        '</span><span class="pk">' + NF.format(e.pkt) + ' Pkt.</span></li>').join("") + '</ol>';
      h += '</div>';
    });
    el.innerHTML = h;
  }

  // ------------------------------------------------------------ Saison
  function saisonAuswerten() {
    const rows = D.saison || [];
    const tage = [...new Set(rows.map(r => r.d))].sort((a, b) => a - b);
    const m = {};
    rows.forEach(r => { const x = m[r.id] = m[r.id] || { id: r.id, name: r.name, je: {} }; x.je[r.d] = r.pkt; x.name = r.name; });
    const sieger = {}, schnitt = {};
    tage.forEach(d => {
      const werte = Object.values(m).filter(x => d in x.je).map(x => x.je[d]);
      const top = Math.max(...werte);
      schnitt[d] = werte.reduce((a, v) => a + v, 0) / werte.length;
      Object.values(m).forEach(x => { if (x.je[d] === top) sieger[x.id] = (sieger[x.id] || 0) + 1; });
    });
    const liste = Object.values(m).map(x => {
      const w = tage.filter(d => d in x.je).map(d => x.je[d]);
      const best = Math.max(...w);
      return Object.assign(x, { gesamt: w.reduce((a, v) => a + v, 0), schnitt: w.length ? w.reduce((a, v) => a + v, 0) / w.length : 0,
        siege: sieger[x.id] || 0, best: best, bestTag: tage.find(d => x.je[d] === best) });
    }).sort((a, b) => b.gesamt - a.gesamt);
    return { tage, liste, schnitt };
  }
  function renderSaison() {
    const el = document.getElementById("v-saison");
    const S = saisonAuswerten();
    if (!S.tage.length) { el.innerHTML = '<div class="hinweis"><strong>Noch keine fertigen Spieltage</strong>Die Statistik füllt sich nach dem ersten abgerechneten Spieltag.</div>'; return; }
    if (!gewaehlt || !S.liste.some(x => x.id === gewaehlt)) gewaehlt = S.liste.some(x => x.id === ich) ? ich : S.liste[0].id;
    const g = S.liste.find(x => x.id === gewaehlt);
    let h = '<div class="chart-titel"><h2>Punkte je Spieltag</h2><span class="leise">Antippen zeigt Werte</span></div>';
    h += '<div class="chart-box" id="chart">' + chartSvg(S, g) + '<div class="tip" id="tip" hidden></div></div>';
    h += '<div class="legende"><span><i style="background:var(--flutlicht)"></i>' + esc(g.name) + '</span><span><i style="background:var(--nebel);height:2px"></i>Schnitt der Liga</span><span><i style="background:var(--gespielt);height:2px"></i>alle anderen</span></div>';
    h += '<h2>Gesamtwertung</h2><table class="saison"><thead><tr><th></th><th>Manager</th><th>Gesamt</th><th>Ø</th><th>Siege</th><th>Bester</th></tr></thead><tbody>' +
      S.liste.map((x, i) => '<tr data-g="' + esc(x.id) + '" class="' + (x.id === gewaehlt ? "gewaehlt" : "") + '"><td>' + (i + 1) + '</td><td>' + esc(x.name) +
        '</td><td class="gesamt">' + NF.format(x.gesamt) + '</td><td>' + NF.format(Math.round(x.schnitt)) + '</td><td>' + x.siege + '</td><td>' + NF.format(x.best) + '</td></tr>').join("") +
      '</tbody></table><p class="leise" style="font-size:13px">Abgerechnete Spieltage 1 bis ' + S.tage[S.tage.length - 1] + '. Zeile antippen, um den Manager im Diagramm hervorzuheben.</p>';
    el.innerHTML = h;
    chartTouch(S, g);
  }
  const CH = { w: 360, h: 220, l: 40, r: 12, t: 12, b: 26 };
  function skalen(S) {
    const alle = S.liste.flatMap(x => S.tage.filter(d => d in x.je).map(d => x.je[d]));
    let lo = Math.min(...alle), hi = Math.max(...alle);
    const schritt = hi - lo > 1500 ? 500 : 250;
    lo = Math.floor(lo / schritt) * schritt; hi = Math.ceil(hi / schritt) * schritt;
    const x = d => S.tage.length === 1 ? (CH.l + CH.w - CH.r) / 2 : CH.l + (S.tage.indexOf(d) / (S.tage.length - 1)) * (CH.w - CH.l - CH.r);
    const y = v => CH.t + (1 - (v - lo) / (hi - lo || 1)) * (CH.h - CH.t - CH.b);
    return { x, y, lo, hi, schritt };
  }
  function pfad(S, sk, je) {
    return S.tage.filter(d => d in je).map((d, i) => (i ? "L" : "M") + sk.x(d).toFixed(1) + " " + sk.y(je[d]).toFixed(1)).join(" ");
  }
  function chartSvg(S, g) {
    const sk = skalen(S);
    let s = '<svg viewBox="0 0 ' + CH.w + ' ' + CH.h + '" role="img" aria-label="Punkte je Spieltag, ' + esc(g.name) + ' hervorgehoben">';
    for (let v = sk.lo; v <= sk.hi; v += sk.schritt) {
      s += '<line x1="' + CH.l + '" x2="' + (CH.w - CH.r) + '" y1="' + sk.y(v) + '" y2="' + sk.y(v) + '" stroke="#26356A" stroke-width="1"/>' +
        '<text x="' + (CH.l - 6) + '" y="' + (sk.y(v) + 4) + '" text-anchor="end" fill="#A9B3CF" font-size="11" font-family="Barlow">' + NF.format(v) + '</text>';
    }
    S.tage.forEach(d => { s += '<text x="' + sk.x(d) + '" y="' + (CH.h - 8) + '" text-anchor="middle" fill="#A9B3CF" font-size="11" font-family="Barlow">' + d + '</text>'; });
    S.liste.filter(x => x.id !== g.id).forEach(x => { s += '<path d="' + pfad(S, sk, x.je) + '" fill="none" stroke="#36446E" stroke-width="1.25" stroke-linejoin="round"/>'; });
    s += '<path d="' + pfad(S, sk, S.schnitt) + '" fill="none" stroke="#A9B3CF" stroke-width="1.5" stroke-dasharray="4 4"/>';
    s += '<path d="' + pfad(S, sk, g.je) + '" fill="none" stroke="#FFC247" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    S.tage.filter(d => d in g.je).forEach(d => { s += '<circle cx="' + sk.x(d) + '" cy="' + sk.y(g.je[d]) + '" r="4" fill="#FFC247" stroke="#0E1733" stroke-width="2"/>'; });
    s += '<line id="fadenkreuz" x1="0" x2="0" y1="' + CH.t + '" y2="' + (CH.h - CH.b) + '" stroke="#F3F0E8" stroke-opacity=".5" stroke-width="1" visibility="hidden"/>';
    s += '<rect x="' + CH.l + '" y="0" width="' + (CH.w - CH.l - CH.r) + '" height="' + CH.h + '" fill="transparent" id="flaeche"/></svg>';
    return s;
  }
  function chartTouch(S, g) {
    const box = document.getElementById("chart");
    const svg = box.querySelector("svg"), tip = document.getElementById("tip"), fk = svg.querySelector("#fadenkreuz");
    const sk = skalen(S);
    function zeig(ev) {
      const r = svg.getBoundingClientRect();
      const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * CH.w;
      let d = S.tage[0], best = 1e9;
      S.tage.forEach(t => { const a = Math.abs(sk.x(t) - px); if (a < best) { best = a; d = t; } });
      const werte = S.liste.filter(x => d in x.je).map(x => x.je[d]).sort((a, b) => b - a);
      const v = g.je[d];
      const platz = v == null ? null : werte.indexOf(v) + 1;
      fk.setAttribute("x1", sk.x(d)); fk.setAttribute("x2", sk.x(d)); fk.setAttribute("visibility", "visible");
      tip.hidden = false;
      tip.innerHTML = 'Spieltag ' + d + '<br><b>' + (v == null ? "–" : NF.format(v)) + '</b> ' + esc(g.name) + (platz ? ', Platz ' + platz : "") +
        '<br><span class="leise">Schnitt ' + NF.format(Math.round(S.schnitt[d])) + ', bester ' + NF.format(werte[0]) + '</span>';
      const links = sk.x(d) / CH.w * r.width;
      tip.style.left = Math.min(Math.max(0, links - 80), r.width - tip.offsetWidth) + "px";
    }
    svg.addEventListener("pointerdown", zeig); svg.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || e.buttons) zeig(e); });
    const weg = () => { tip.hidden = true; fk.setAttribute("visibility", "hidden"); };
    svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") weg(); });   // Touch: bleibt stehen
    tipWeg = weg;
  }

  // ------------------------------------------------------------ Rahmen
  function rendern() {
    if (!D) return;
    document.getElementById("standText").textContent = D.stand ? "Stand " + uhr(D.stand) : "Stand " + uhr(ladezeit);
    renderLive(); renderStrafen(); renderSaison();
    document.getElementById("fuss").textContent = "Daten aus Kickbase, Punkte alle 10 Minuten aktualisiert.";
  }
  function zeigeEinrichtung() {
    document.getElementById("v-live").innerHTML = '<div class="hinweis"><strong>Noch nicht verbunden</strong>Trag in der Datei config.js die Adresse deiner Apps-Script-Web-App ein.</div>';
    document.getElementById("standText").textContent = "";
  }
  function zeigeFehler(msg) {
    document.getElementById("v-live").innerHTML = '<div class="hinweis"><strong>Daten konnten nicht geladen werden</strong>' + esc(msg) +
      '. Prüf die Internetverbindung oder die Web-App-Adresse in config.js.<br><button id="nochmal">Erneut laden</button></div>';
  }
  function wechseln(v) {
    ansicht = v; store.set("kb_ansicht", v);
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
    ["live", "strafen", "saison"].forEach(x => { document.getElementById("v-" + x).hidden = x !== v; });
    window.scrollTo(0, 0);
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("button, tr[data-g]");
    if (!t) return;
    if (t.dataset.v) { wechseln(t.dataset.v); return; }
    if (t.id === "stand" || t.id === "nochmal") { laden(); return; }
    if (t.dataset.m) { offen.has(t.dataset.m) ? offen.delete(t.dataset.m) : offen.add(t.dataset.m); renderLive(); return; }
    if (t.dataset.ich !== undefined) { ich = ich === t.dataset.ich ? null : t.dataset.ich; store.set("kb_ich", ich); gewaehlt = null; rendern(); return; }
    if (t.dataset.tag) {
      const d = Number(t.dataset.tag);
      if (!offenTage) { const tg = (D.strafen.tage || []).map(x => x.d); offenTage = new Set(tg.length ? [Math.max(...tg)] : []); }
      offenTage.has(d) ? offenTage.delete(d) : offenTage.add(d);
      renderStrafen(); return;
    }
    if (t.dataset.g) { gewaehlt = t.dataset.g; renderSaison(); }
  });
  let tipWeg = () => {};
  document.addEventListener("pointerdown", e => { const box = document.getElementById("chart"); if (!box || !box.contains(e.target)) tipWeg(); }, true);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - ladezeit > 30000) laden(); });
  setInterval(() => { if (document.visibilityState === "visible") laden(); }, 60000);
  setInterval(() => { if (D && document.visibilityState === "visible") { renderLive(); } }, 20000);
  wechseln(ansicht);
  try { const alt = JSON.parse(store.get("kb_daten") || "null"); if (alt && alt.ok) { D = alt; rendern(); } } catch (e) { /* egal */ }
  laden();
})();
</script>
